<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b1f2a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" href="icon-192.png">
<title>T50 RAZEM</title>
<style>
:root{--bg:#12151c;--p1:#1b1f2a;--p2:#242a38;--ln:#323a4d;--tx:#e8ebf2;--mu:#8b93a7;--acc:#ff6600}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:hidden}
#top{position:fixed;left:0;right:0;top:0;z-index:20;background:var(--p1);border-bottom:1px solid var(--ln)}
.erow{display:flex;gap:5px;align-items:center;padding:5px 8px 3px}
.brand{font-weight:800;font-size:13px;letter-spacing:.3px}.brand b{color:var(--acc)}
.erow .n{color:var(--mu);font-size:11px;white-space:nowrap;text-align:right;line-height:1.15;max-width:64px}
#codeIn{flex:1;min-width:0;font-size:18px;font-weight:700;letter-spacing:3px;text-align:center;padding:4px 6px;height:34px;border-radius:8px;border:1.5px solid var(--acc);background:var(--bg);color:var(--tx)}
#codeIn::placeholder{letter-spacing:1px;font-size:14px;font-weight:500;color:#6d7488}
#codeIn.bad{animation:bad .35s;border-color:#ff4d4d}
@keyframes bad{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn{border:1px solid var(--ln);background:var(--p2);color:var(--tx);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600}
.erow .btn{height:34px;padding:0 10px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.warn{color:#ffb3b3}
#hint{padding:0 10px 2px;font-size:11px;color:var(--mu);white-space:nowrap;overflow-x:auto}
#hint b{color:#9fd0ff}
#chips{display:flex;gap:5px;overflow-x:auto;padding:3px 8px 5px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:0 0 auto;border:1px solid var(--ln);background:var(--p2);color:var(--tx);border-radius:14px;padding:4px 9px;font-size:12px;font-weight:600;position:relative}
#chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#chips button.glow{background:#FF6600;border-color:#fff;color:#fff;animation:mjg .8s ease-in-out infinite alternate}
@keyframes mjg{from{box-shadow:0 0 0 0 #ff660000}to{box-shadow:0 0 10px 3px #ff6600}}
#chips button.sn{padding-left:22px}
#chips button b.soon{position:absolute;top:-3px;left:-3px;min-width:16px;height:16px;border-radius:8px;background:#FFD700;color:#000;font:700 10px/16px system-ui;padding:0 4px;border:1px solid #fff}
#chips button i{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:#FF6600;color:#fff;font:700 10px/16px system-ui;font-style:normal;padding:0 4px;border:1px solid #fff}
#chips button.on i{background:#fff;color:#FF6600}
#home{padding:10px 10px 30px}
#frames{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg)}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
#frames iframe.on{display:block}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:10px}
.card h2{margin:0 0 8px;font-size:14px;color:var(--acc);letter-spacing:.4px}
.sum{display:flex;justify-content:space-between;align-items:center;background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.sum .big{font-weight:800;font-size:14px}.sum>span:last-child{text-align:right}
.sum .bet{color:#fff;background:#FF6600;border-radius:8px;padding:4px 9px;font-weight:800;white-space:nowrap;display:inline-block}
.sum .mu{color:var(--mu)}
.ah{display:flex;justify-content:space-between;align-items:center;margin:0 0 6px}
.ah b{font-size:14px}.ah span{font-size:12px;color:var(--mu)}.ah span.g{color:#ff9a4d;font-weight:700}
.sech{font-size:11px;color:var(--mu);margin:6px 0 3px;letter-spacing:.4px}
.nxl{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:baseline;border-radius:8px;padding:6px 8px;margin:3px 0;cursor:pointer;border:1px solid transparent}
.nxl .id{font-weight:800;font-size:12.5px;min-width:46px}
.nxl .t{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.nxl .s{grid-column:2;font-size:11.5px;opacity:.85;overflow-wrap:anywhere}
.nxl .m{grid-column:2;font-size:11px;opacity:.75;margin-top:2px}
.nxl .go{float:right;opacity:.6;font-size:11px}
.p1{background:#FF6600;color:#fff;border:2px solid #fff;font-size:14px}
.p2{background:rgba(255,102,0,.18);color:#ffcfa8;border:1.5px dashed #FF6600}
.p3{background:#DEEBF7;color:#1F4E78}
.p4{background:#7030A0;color:#fff}
.p5{background:var(--p2);color:#ffc896}
.p6{background:transparent;color:var(--mu);border-color:var(--ln)}
.last{color:var(--mu);font-size:12px;margin:4px 2px 10px}.last b{color:var(--tx);margin-left:6px;font-family:ui-monospace,monospace}
.note{font-size:11.5px;color:var(--mu);margin:2px 0 4px}
table.stt{width:100%;border-collapse:collapse;font-size:13px}
table.stt td{padding:5px 4px;border-bottom:1px solid var(--ln)}table.stt td:last-child{text-align:right;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.row .btn{flex:1 1 140px}
.ok{color:#5fd38a}.er{color:#ff8a8a}
.small{font-size:12px;color:var(--mu)}
#toast{position:fixed;left:10px;right:10px;bottom:16px;z-index:50;background:#0b0d12f2;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;font-size:13px;display:none;max-height:55vh;overflow:auto;box-shadow:0 6px 24px #0009}
#toast.on{display:block}
#toast .ap{color:#ff9a4d;font-weight:700;margin-top:6px}
#loading{padding:30px 16px;text-align:center;color:var(--mu)}
input[type=file]{display:none}
.sw{display:flex;align-items:center;gap:8px;margin:8px 0}
</style>
</head>
<body>
<div id="top">
  <div class="erow">
    <span class="brand">T50<b>R</b></span>
    <input id="codeIn" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" placeholder="kod">
    <button class="btn pri" id="addBtn">Dodaj</button><button class="btn warn" id="undoBtn">⟲</button>
    <span class="n" id="hdrN"></span>
  </div>
  <div id="hint"></div>
  <div id="chips"></div>
</div>
<main id="home"><div id="loading">Ładowanie tabel…</div></main>
<div id="frames"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json">

<script>
"use strict";
const APP_VER = '1.12.1';
const LS = { added: 't50razem_v1_added', autobk: 't50razem_v1_autobk', lastbk: 't50razem_v1_lastbk', lastimp: 't50razem_v1_lastimp' };
// ---- MOJE GRY: modele dodane przyciskiem w oknie statystyk (karta GRA / wiersz TABELI); start = liczba kodów w chwili dodania ----
const MOJE = { key: 't50razem_v1_moje',
  list() { try { const v = JSON.parse(localStorage.getItem(this.key) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } },
  save(a) { try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },
  has(k, id) { return this.list().some(g => g.k === k && g.id === id); },
  add(k, id, info) { const a = this.list().filter(g => !(g.k === k && g.id === id)), n = allCodes().length; a.push({ k, id, start: n, t: Date.now(), info: info || '' }); this.save(a); try { toast(`▶ <b>${esc(id)}</b> dodany do MOJE GRY (wynik od Nr ${fmtN(n + 1)})`); refresh(); } catch (e) {} },
  del(k, id) { this.save(this.list().filter(g => !(g.k === k && g.id === id))); try { toast(`Usunięto <b>${esc(id)}</b> z MOJE GRY`); refresh(); } catch (e) {} },
  // MOJE ZAKŁADY — zakłady zagrane naprawdę: { k, id, row (0-based), step, stake, t }; wynik z tabeli modelu (kurs 3: WIN = +2 × stawka)
  bkey: 't50razem_v1_bets',
  bets() { try { const v = JSON.parse(localStorage.getItem(this.bkey) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } },
  saveBets(a) { try { localStorage.setItem(this.bkey, JSON.stringify(a)); } catch (e) {} },
  N() { return allCodes().length; },
  lab(k) { const x = APPS.find(z => z.k === k); return x ? x.short : k; },
  // model z zakładki SZUKAJ: usuń z RAZEM (lista w tabeli SZUKAJ + MOJE GRY); w appce SZUKAJ zostaje
  szkDel(id) {
    // zakłady usuwanego modelu: zapamiętaj wynik (po usunięciu tabela go już nie policzy)
    const N = allCodes().length, B = this.bets(); B.forEach(b => { if (b.k === 'szk' && b.id === id && !b.fix) b.fix = b.row < N ? (this.rowRes('szk', id, b.row) || 'none') : 'none'; }); this.saveBets(B);
    try { $('fr_szk').contentWindow.T50.remove(id); } catch (e) {} this.save(this.list().filter(g => !(g.k === 'szk' && g.id === id))); try { toast(`Usunięto <b>${esc(id)}</b> z zakładki SZUKAJ`); refresh(); } catch (e) {} },
  card(k, id) { try { return [].concat(...W(k).cards(() => {}).map(s => s.cards)).find(x => (x.mid || x.id) === id) || null; } catch (e) { return null; } },
  rowRes(k, id, r) { try { const fw = $('fr_' + k).contentWindow, T = fw.T50 || fw.T60; return T && T.rowRes ? T.rowRes(id, r) : fw.UT.rowRes(id, r); } catch (e) { return null; } },
  betList(k, id) { const N = allCodes().length; return this.bets().filter(b => b.k === k && b.id === id).sort((a, b) => a.row - b.row || a.t - b.t).map(b => Object.assign({}, b, { res: (r => r == null && b.fix ? (b.row >= N ? 'none' : b.fix) : r)(b.row >= N ? null : this.rowRes(k, id, b.row)) })); },
  addBet(k, id, row, step, stake) { const a = this.bets(); a.push({ k, id, row, step, stake, t: Date.now() }); this.saveBets(a); try { toast(`Zapisano zakład <b>${esc(id)}</b>: Nr ${fmtN(row + 1)} · k${step} · ${stake} zł`); refresh(); } catch (e) {} },
  delBet(t) { this.saveBets(this.bets().filter(b => b.t !== t)); try { refresh(); } catch (e) {} },
};
window.__MOJE = MOJE;
// MOJE z zakładem na następnym wierszu → przycisk MOJE świeci, dopóki nie wejdziesz w zakładkę (zapamiętane: liczba kodów przy wejściu)
const MOJE_SEEN = 't50razem_v1_moje_seen';
function mojeBets() {
  let n = 0;
  MOJE.list().forEach(g => { try { const c = [].concat(...W(g.k).cards(() => {}).map(s => s.cards)).find(x => (x.mid || x.id) === g.id); if (c && c.lines.some(l => l.p === 1)) n++; } catch (e) {} });
  return n;
}
const MASTER_SEED = '/*__MASTER_SEED__*/';   // najdłuższy wspólny ciąg Test50 (T50 x1x 1T+200+2T, od Nr 1)
const SEED_N = MASTER_SEED.length / 3;
window.T50_MASTER_N = SEED_N;   // wiersze ≥ seed = dopisane w RAZEM (znacznik w tabelach)
const APPS = /*__APPS__*/;
// ===== UG — wspólny ekran GRA (wzór T60 RAZEM / PIKOFF): baner + karta na model + okno ze wszystkimi etykietami =====
// cfg = { N, top?, bindTop?, note?, idleSub?, sections:[{name?, cards:[{id, rule, lines:[{p,txt,sub,er?}], meta:[l,r], go(er?)}]}], last:[kody] }
// p: 1 GRA pewna · 2 GRA warunkowa / w toku · 3 trigger jeśli wpadnie · 4 gra za n / start · 5 inne zdarzenie · 6 brak
// ===== MOJE GRY — przycisk „Gram / obserwuję” + MOJE ZAKŁADY (zagrane naprawdę: Nr · krok · kwota) w oknach statystyk; zapis w powłoce RAZEM =====
window.__MJ = window.__MJ || (function () {
  const api = () => { try { return window.__MOJE || (window.parent !== window && window.parent.__MOJE) || null; } catch (e) { return null; } };
  const frameK = () => { try { return window.frameElement ? window.frameElement.id.replace(/^fr_/, '') : null; } catch (e) { return null; } };
  const st = document.createElement('style');
  st.textContent = '.mj-b{display:block;width:100%;margin:8px 0 4px;padding:10px;border-radius:9px;border:0;background:#7030A0;color:#fff;font-weight:700;font-size:14px;cursor:pointer}.mj-b.on{background:#242a38;border:1px solid #ff6600;color:#ffb27a}.mj-h{font-size:11.5px;color:#8b93a7;margin-bottom:6px}'
    + '.mj-bets{margin:8px 0;padding:8px;border:1px solid #323a4d;border-radius:9px;background:#161a24}.mj-lb{font-size:12px;font-weight:700;color:#ffb27a;margin-bottom:4px}'
    + '.mj-r{display:flex;gap:6px;align-items:center;font-size:12.5px;padding:3px 0;border-bottom:1px solid #2a3142}.mj-r span:first-child{flex:1}.mj-r .pos{color:#5fd38a}.mj-r .neg{color:#ff8a8a}'
    + '.mj-del{background:none;border:0;color:#8b93a7;font-size:14px;padding:0 4px;cursor:pointer}'
    + '.mj-f{display:flex;gap:5px;align-items:flex-end;margin-top:6px;flex-wrap:wrap}.mj-f label{display:flex;flex-direction:column;font-size:10.5px;color:#8b93a7}'
    + '.mj-f input{width:64px;padding:6px;border-radius:7px;border:1px solid #323a4d;background:#12151c;color:#e8ebf2;font-size:15px;font-weight:700}.mj-f .mj-nr{width:84px}'
    + '.mj-x{display:block;width:100%;margin:4px 0;padding:9px;border-radius:9px;border:1px solid #c00000;background:#2a1a1f;color:#ff8a8a;font-weight:700;font-size:13.5px;cursor:pointer}'
    + '.mj-save{flex:1;min-width:110px;padding:9px;border-radius:8px;border:0;background:#FF6600;color:#fff;font-weight:700;font-size:13.5px;cursor:pointer}'
    + '.mj-sum{margin:8px 0;padding:7px 8px;border:1px solid #7030A0;border-radius:10px;background:#1b1f2a;color:#fff;font:12px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.mj-sum h2{font-size:13px;margin:0 0 5px;color:#ffb27a}'
    + '.mj-sum table{width:100%!important;border-collapse:collapse;table-layout:auto!important}.mj-sum th,.mj-sum td{width:auto!important;max-width:none!important;overflow:visible!important;position:static!important}.mj-sum th,.mj-sum td{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif!important;text-transform:none!important;letter-spacing:0!important;background:none!important;color:#fff!important;font-size:12px}.mj-sum th{color:#8b93a7!important;font-size:10.5px}.mj-sum td .pos{color:#5fd38a!important}.mj-sum td .neg{color:#ff8a8a!important}.mj-sum td .mu{color:#8b93a7!important}.mj-sum td.ks{color:#c9cfdc!important;font-size:11px}.mj-sum th{text-transform:none;letter-spacing:0;font-size:10.5px;color:#8b93a7;font-weight:600;text-align:right;padding:3px 3px;border-bottom:1px solid #323a4d}.mj-sum td{padding:3px 3px;border-bottom:1px solid #2a3142;text-align:right;white-space:nowrap}'
    + '.mj-sum th:first-child,.mj-sum td:first-child{text-align:left}.mj-sum th{white-space:normal!important}.mj-sum td:first-child{white-space:normal!important}.mj-sum td.ks{white-space:normal;text-align:left;font-size:11px;color:#c9cfdc;min-width:70px}.mj-sum th.ks{text-align:left}.mj-sum .pos{color:#5fd38a;font-weight:700}.mj-sum .neg{color:#ff8a8a;font-weight:700}.mj-sum tr.s td{font-weight:800;border-top:1px solid #7030A0}.mj-sum .mu{color:#8b93a7;font-size:10.5px;margin-top:5px}';
  document.head.appendChild(st);
  const TXT = on => on ? '■ W MOJE GRY — usuń z listy' : '▶ Gram / obserwuję — dodaj do MOJE GRY';
  const q = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/[<]/g, '&lt;');
  function html(k, id) {
    const a = api(); k = k || frameK(); if (!a || !k || id == null) return '';
    const on = a.has(k, String(id));
    return `<button class="mj-b${on ? ' on' : ''}" data-mjk="${q(k)}" data-mjid="${q(id)}">${TXT(on)}</button><div class="mj-h"${on ? ' hidden' : ''}>Model trafi na zakładkę MOJE — z bieżącym stanem i wynikiem od chwili dodania (pierwszy WIN albo BUST / LOSS).</div>`
      + (k === 'szk' && a.szkDel ? `<button class="mj-x" data-mjid="${q(id)}">✕ Usuń ten model z RAZEM (zakładka SZUKAJ)</button>` : '');
  }
  // MOJE ZAKŁADY: lista + formularz (domyślnie: następny wiersz, krok i stawka z linii „GRA na następnym wierszu” karty modelu)
  function bets(k, id) {
    const a = api(); k = k || frameK(); if (!a || !a.betList || !k || id == null) return '';
    id = String(id);
    const L = a.betList(k, id), N = a.N(), c = a.card(k, id), l1 = c ? c.lines.find(l => l.p === 1) : null;
    const dk = l1 ? (l1.k || +((String(l1.txt).match(/(?:krok(?: gry)?|K|k)\s?(\d)/) || [])[1]) || '') : '';
    const ds = l1 && l1.stake ? l1.stake : '';
    let put = 0, wyn = 0;
    const rows = L.map(b => {
      put += b.stake; const v = b.res === 'win' ? 2 * b.stake : b.res === 'lost' ? -b.stake : 0; wyn += v;
      const r = b.res === 'win' ? `✔ WIN +${2 * b.stake} zł` : b.res === 'lost' ? `✗ −${b.stake} zł` : b.res === 'none' ? '? model nie grał w tym wierszu' : 'czeka na wynik';
      return `<div class="mj-r"><span>Nr ${(b.row + 1).toLocaleString('pl-PL')} · k${b.step} · <b>${b.stake} zł</b></span><span class="${b.res === 'win' ? 'pos' : b.res === 'lost' ? 'neg' : ''}">${r}</span><button class="mj-del" data-t="${b.t}" title="usuń wpis">✕</button></div>`;
    }).join('');
    return `<div class="mj-bets" data-mjk="${q(k)}" data-mjid="${q(id)}"><div class="mj-lb">MOJE ZAKŁADY${L.length ? ` · ${L.length} · postawione ${put} zł · wynik ${wyn >= 0 ? '+' : '−'}${Math.abs(wyn)} zł` : ' — zapisz zakład, który naprawdę zagrałeś'}</div>${rows}
      <div class="mj-f"><label>Nr wiersza<input type="number" class="mj-nr" inputmode="numeric" value="${N + 1}"></label><label>krok<input type="number" class="mj-k" inputmode="numeric" min="1" max="8" value="${dk}"></label><label>postawione zł<input type="number" class="mj-zl" inputmode="numeric" min="1" value="${ds}"></label><button class="mj-save">Zapisz zakład</button></div></div>`;
  }
  function bind(root, info) {
    root.querySelectorAll('.mj-x').forEach(b => b.onclick = e => {   // model z SZUKAJ: usuń z RAZEM (w SZUKAJ zostaje)
      e.stopPropagation(); const a = api(), id = b.dataset.mjid; if (!a || !a.szkDel) return;
      if (!confirm(`Usunąć ${id} z RAZEM (zakładka SZUKAJ)? W appce SZUKAJ model zostaje.`)) return;
      const pop = b.closest('.ut-pop,.ug-pop'); if (pop) pop.remove();
      a.szkDel(id);
    });
    root.querySelectorAll('.mj-b').forEach(b => b.onclick = e => {
      e.stopPropagation(); const a = api(); if (!a) return;
      const k = b.dataset.mjk, id = b.dataset.mjid;
      if (a.has(k, id)) a.del(k, id); else a.add(k, id, info || '');
      const on = a.has(k, id); b.classList.toggle('on', on); b.textContent = TXT(on);
      const h = b.nextElementSibling; if (h && h.classList.contains('mj-h')) h.hidden = on;
    });
    root.querySelectorAll('.mj-bets').forEach(box => {
      const k = box.dataset.mjk, id = box.dataset.mjid, a = api(); if (!a) return;
      const redo = () => { const t = document.createElement('div'); t.innerHTML = bets(k, id); const nb = t.firstElementChild; box.replaceWith(nb); bind(nb.parentNode, info); };
      box.onclick = e => e.stopPropagation();
      const sv = box.querySelector('.mj-save');
      if (sv) sv.onclick = () => {
        const nr = +box.querySelector('.mj-nr').value, kk = +box.querySelector('.mj-k').value, zl = +box.querySelector('.mj-zl').value;
        if (!(nr >= 1) || !(kk >= 1 && kk <= 8) || !(zl > 0)) { box.querySelector('.mj-lb').textContent = 'Podaj Nr wiersza, krok 1–8 i kwotę w zł'; return; }
        a.addBet(k, id, nr - 1, kk, zl); redo();
      };
      box.querySelectorAll('.mj-del').forEach(d => d.onclick = () => { if (confirm('Usunąć ten wpis z MOJE ZAKŁADY?')) { a.delBet(+d.dataset.t); redo(); } });
    });
  }

  // MOJE ZAKŁADY — podsumowanie (dół STATY): k = tabela; bez k (powłoka) = wszystkie tabele
  function sum(k) {
    const a = api(); if (!a || !a.betList || !a.bets) return '';
    if (k === undefined) k = frameK();
    const all = a.bets().filter(b => !k || b.k === k), keys = [];

function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }

function syncAdded(quiet) {

  if (!quiet) toast(`Wczytano kody z innej appki: n=${fmtN(SEED_N + added.length)} (${added.length - prev >= 0 ? '+' : '−'}${Math.abs(added.length - prev)})`);

try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

// ---- zapis kodów do kluczy każdej tabeli (RAZEM = jedyne źródło prawdy) ----
function writeAppKeys() {
  const all = allCodes();
  for (const a of APPS) {
    if (a.store === 'parent') continue;   // SZUKAJ: kody czyta z powłoki
    if (a.store === 'csv') lsSet(a.key, all.join(','));
    else if (a.store === 'full') lsSet(a.key, all.join(''));
    else if (a.store === 'json') lsSet(a.key, JSON.stringify(all));

}

// ---- ramki ----
const W = k => { const f = $('fr_' + k); return f && f.contentWindow && f.contentWindow.T50; };
let cur = 'gra', homeView = 'gra', ready = 0;
function layout() {
  const h = $('top').offsetHeight;
  $('frames').style.top = h + 'px';
  $('home').style.paddingTop = (h + 10) + 'px';
}
function buildFrames() {
  writeAppKeys();
  for (const a of APPS) {
    const f = document.createElement('iframe');
    f.id = 'fr_' + a.k; f.title = a.name;
    f.addEventListener('load', () => { ready++; if (ready === APPS.length) onReady(); }, { once: true });
    f.srcdoc = a.html;
    $('frames').appendChild(f);
  }
}
function checkSync() {
  const N = allCodes().length, last = allCodes()[N - 1], bad = [];
  for (const a of APPS) { const t = W(a.k); if (!t || t.count() !== N || t.last() !== last) bad.push(a); }
  if (bad.length) { writeAppKeys(); bad.forEach(a => { try { W(a.k).sync(); } catch (e) { console.error(e); } }); }
  return bad.map(a => a.name);
}
function onReady() {
  const bad = checkSync();
  if (bad.length) console.warn('resync', bad);
  renderChips(); show(cur);
}

// ---- nawigacja ----
function renderChips() {
  const L = gatherLines();
  $('chips').innerHTML = [['gra', 'GRA'], ['moje', 'MOJE'], ...APPS.map(a => [a.k, a.short]), ['dane', 'DANE']].map(([k, t]) => {
    const n = k === 'moje' ? MOJE.list().length : (L.find(x => x.a.k === k) || {}).bets || 0, sn = (L.find(x => x.a.k === k) || {}).soon || [];
    if (k === 'moje' && cur === 'moje') lsSet(MOJE_SEEN, String(allCodes().length));   // jesteś w MOJE → zakład widziany
    const mb = k === 'moje' ? mojeBets() : 0, glow = mb && k !== cur && lsGet(MOJE_SEEN, '') !== String(allCodes().length);
    return `<button data-k="${k}" class="${k === cur ? 'on' : ''}${glow ? ' glow' : ''}${sn.length ? ' sn' : ''}">${t}${mb ? ' ▼' + mb : ''}${sn.length ? `<b class="soon">${sn.join(',')}</b>` : ''}${n ? `<i>${n}</i>` : ''}</button>`;
  }).join('');
  $('chips').querySelectorAll('button').forEach(b => b.onclick = () => show(b.dataset.k));
  $('hdrN').innerHTML = `n=${fmtN(allCodes().length)}${added.length ? `<br>+${added.length}` : ''}`;
  renderHint(L);
}
function show(k) {
  cur = k;
  if (k === 'moje') { lsSet(MOJE_SEEN, String(allCodes().length)); const b = document.querySelector('#chips button[data-k="moje"]'); if (b) b.classList.remove('glow'); }
  $('chips').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  const isApp = APPS.some(a => a.k === k);
  document.querySelectorAll('#frames iframe').forEach(f => f.classList.toggle('on', f.id === 'fr_' + k));
  $('frames').style.display = isApp ? '' : 'none';
  $('home').style.display = isApp ? 'none' : '';
  layout();
  if (isApp) { try { W(k).render(); } catch (e) {} }
  else { homeView = k; renderHome(); window.scrollTo(0, 0); }
}
function goModel(ak, id, er) {
  show(ak);
  setTimeout(() => { try { W(ak).go(id, er); } catch (e) { console.error(e); } }, 30);
  if (navigator.vibrate) navigator.vibrate(10);
}

// ---- zbiorczy ekran GRA ----
function gatherLines() {
  return APPS.map(a => {
    let r = { sections: [], trig: [] };
    try { r = W(a.k).lines(); } catch (e) {}
    const items = [].concat(...r.sections.map(s => s.items));
    const p1 = items.filter(x => x.p === 1);
    const soon = [...new Set([].concat(...items.map(x => [x].concat(x.more || []))).filter(x => x.p === 4).map(x => +((String(x.txt).match(/gra za (\d+)/) || [])[1] || 0)).filter(n => n >= 2 && n <= 3))].sort((a, b) => a - b);   // gra z pewnym terminem (żółty znaczek)
    return { a, r, soon, bets: p1.length, stake: p1.reduce((s, x) => s + (x.stake || 0), 0), cond: items.filter(x => x.p === 2).length };
  });
}
function lineHtml(ak, x) {
  const more = (x.more || []).map(m => `<span class="m">+ ${esc(m.txt)}</span>`).join('');
  return `<div class="nxl p${x.p}" data-a="${ak}" data-id="${esc(x.id)}" data-er="${x.er || ''}"><b class="id">${esc(x.id)}</b><span class="t">${esc(x.txt)}<span class="go">›</span></span>${x.sub ? `<span class="s">${esc(x.sub)}</span>` : ''}${more}</div>`;
}
function renderHint(L) {
  const m = new Map();
  L.forEach(({ a, r }) => (r.trig || []).forEach(([c, ids]) => { if (!m.has(c)) m.set(c, []); m.get(c).push(a.hintPrefix === false ? ids.join(',') : `${a.short}:${ids.join(',')}`); }));
  $('hint').innerHTML = m.size ? 'TRIGGER da: ' + [...m].map(([c, l]) => `<b>${c}</b> → ${esc(l.join(' '))}`).join(' · ') : 'Żaden kod w następnym wierszu nie da teraz triggera.';
}
function renderGraHome() {
  const sections = [];
  let note = '';
  APPS.forEach(a => {
    let secs = [];
    try { secs = W(a.k).cards((id, er) => goModel(a.k, id, er)); } catch (e) { console.error(e); }
    secs.forEach(sc => sc.cards.forEach(c => { c.app = a.k; }));   // MOJE GRY: z której tabeli jest karta
    secs.forEach(sc => sections.push({ name: sc.full ? sc.name : sc.name && sc.name !== a.name ? `${a.short} · ${sc.name}` : a.name, cards: sc.cards }));
    if (a.k === 'trojka') { try { note = '<b>TRÓJKA</b> · ' + W(a.k).note(); } catch (e) {} }
  });
  UG.render($('home'), { N: allCodes().length, sections, note, last: allCodes().slice(-8), idleSub: 'Żadna tabela nie gra na następnym wierszu.' });
}
// ---- MOJE GRY: karty wybranych modeli (bieżący stan z tabeli) + pierwsze rozstrzygnięcie od chwili dodania ----
function renderMoje() {
  const L = MOJE.list(), N = allCodes().length, cards = [];
  L.forEach(g => {
    const a = APPS.find(x => x.k === g.k); if (!a) return;
    let c = null, res = null;
    try { c = [].concat(...W(g.k).cards((id, er) => goModel(g.k, id, er)).map(s => s.cards)).find(x => (x.mid || x.id) === g.id) || null; } catch (e) {}
    try { const fw = $('fr_' + g.k).contentWindow, T = fw.T50 || fw.T60; res = T && T.track ? T.track(g.id, g.start) : fw.UT.track(g.id, g.start); } catch (e) {}
    const lines = [res
      ? { p: res.win ? 2 : 5, act: true, txt: `${res.win ? '✔ WIN' : '✖ BUST / LOSS'} w Nr ${fmtN(res.i + 1)} — od dodania`, sub: res.t, er: res.i + 1 }
      : { p: 6, act: true, txt: `śledzę od Nr ${fmtN(g.start + 1)} · bez rozstrzygnięcia (${fmtN(N - g.start)} kod.)`, sub: g.info || '' }];
    const B = MOJE.betList(g.k, g.id);
    if (B.length) {
      let put = 0, wyn = 0; B.forEach(b => { put += b.stake; wyn += b.res === 'win' ? 2 * b.stake : b.res === 'lost' ? -b.stake : 0; });
      const lb = B[B.length - 1];
      lines.push({ p: 0, act: true, txt: `Moje zakłady: ${B.length} · postawione ${fmtN(put)} zł · wynik ${wyn >= 0 ? '+' : '−'}${fmtN(Math.abs(wyn))} zł`,
        sub: `ostatni: Nr ${fmtN(lb.row + 1)} · k${lb.step} · ${lb.stake} zł · ${lb.res === 'win' ? 'WIN' : lb.res === 'lost' ? 'przegrany' : lb.res === 'none' ? 'model nie grał' : 'czeka'}`, er: lb.row + 1 });
    }
    if (c) lines.push(...c.lines);
    cards.push({ id: g.id, app: g.k, mid: g.id, rule: `${a.short} · od Nr ${fmtN(g.start + 1)}${c && c.rule ? ' · ' + c.rule : ''}`, lines,
      meta: c ? c.meta : null, go: er => c ? c.go(er) : goModel(g.k, g.id, er), stats: c && c.stats ? c.stats : null });
  });
  if (!cards.length) {
    $('home').innerHTML = `<div class="ug"><div class="ug-none" style="margin-top:8px;text-align:left"><b>MOJE GRY — pusto.</b><br><br>Przytrzymaj kartę modelu na GRA albo wiersz w TABELI modelu → w oknie statystyk <b>„▶ Gram / obserwuję — dodaj do MOJE GRY”</b>.<br><br>Model zostaje tu z bieżącym stanem i wynikiem od chwili dodania (pierwszy WIN albo BUST / LOSS). Usuwasz go tym samym przyciskiem.</div></div>`;
    __MJ.mount($('home').firstElementChild, null); return;
  }
  UG.render($('home'), { N, all: true, sections: [{ name: `▶ MOJE GRY · ${cards.length}`, cards }], last: allCodes().slice(-8),
    note: 'Przytrzymaj kartę → statystyki i „usuń z MOJE GRY” · tapnij → tabela modelu.', idleSub: 'Żaden z MOICH modeli nie gra na następnym wierszu.' });
  __MJ.mount($('home').querySelector('.ug') || $('home'), null);
}
function renderHome() { if (homeView === 'dane') renderDane(); else if (homeView === 'moje') renderMoje(); else renderGraHome(); }
function refresh() { renderChips(); if (!APPS.some(a => a.k === cur)) renderHome(); }

// ---- wpis / cofnij ----
let toastT = null;
function toast(html, ms = 3500) {
  const t = $('toast'); t.innerHTML = html; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
}
$('toast').onclick = () => $('toast').classList.remove('on');
function addCode(c) {
  syncAdded();   // czytaj → zmień → zapisz (nie gub kodów dopisanych w innej appce)
  added.push(c); saveAdded();
  const N = allCodes().length, parts = [];
  for (const a of APPS) {
    let m = '';
    try { m = W(a.k).add(c) || ''; } catch (e) { console.error(e); }
    m = m.replace(/^Nr \d+: <b>\d{3}<\/b>(<br>)?/, '').trim();
    if (m) parts.push(`<div class="ap">${a.short}</div>${m}`);
  }
  const bad = checkSync();
  refresh();
  const L = gatherLines(), bets = L.reduce((s, x) => s + x.bets, 0), stake = L.reduce((s, x) => s + x.stake, 0);
  const nxt = bets ? `<div class="ap" style="color:#fff;background:#FF6600;border-radius:6px;padding:4px 6px">▼ NASTĘPNY KOD = GRA: ${L.filter(x => x.bets).map(x => `${x.a.short} ${x.bets}×`).join(' · ')} · ${fmtN(stake)} zł</div>` : '';
  toast(`Nr ${fmtN(N)}: <b>${c}</b>${nxt}${parts.join('')}${bad.length ? `<div class="er">Ponowne przeliczenie: ${bad.join(', ')}</div>` : ''}`, bets ? 7000 : 4500);
  if (navigator.vibrate) navigator.vibrate(bets ? [60, 60, 120] : 25);
  if (lsGet(LS.autobk, '1') === '1' && added.length % 10 === 0) exportJSON(true);
}
function undo() {
  syncAdded();
  if (!added.length) { toast('Brak dopisanych kodów do cofnięcia (kody z pliku są chronione).'); return; }
  const N = allCodes().length, c = added[added.length - 1];
  if (!confirm(`Cofnąć Nr ${N}: ${c}?\n(cofa we wszystkich tabelach)`)) return;
  added.pop(); saveAdded();
  for (const a of APPS) { try { W(a.k).undo(); } catch (e) { console.error(e); } }
  checkSync(); refresh();
  toast(`Cofnięto Nr ${fmtN(N)}: ${c}`);
}
function submitCode() {
  const inp = $('codeIn'), v = inp.value.trim();
  if (!v) return;
  if (!VALID.has(v)) {
    inp.classList.remove('bad'); void inp.offsetWidth; inp.classList.add('bad');
    toast(`„${esc(v)}” to nie jest kod z ciągu Test50 (3 cyfry 0/1: 000…111).`);
    inp.select(); return;
  }
  inp.value = ''; inp.classList.remove('bad');
  addCode(v);
  inp.focus();
}
$('codeIn').addEventListener('input', () => {
  const inp = $('codeIn'); inp.value = inp.value.replace(/\D/g, '').slice(0, 3); inp.classList.remove('bad');
  if (inp.value.length === 3) submitCode();
});
$('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submitCode(); } });
$('addBtn').onclick = submitCode;
$('undoBtn').onclick = () => { undo(); $('codeIn').focus(); };

// ---- DANE: eksport (format TRÓJKA), import, test ----
function stamp() { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }
function exportJSON(auto) {
  const codes = allCodes();
  const name = `v13_${stamp()}_${codes.length}kod.json`;
  // format TRÓJKI (app: v13_troika) — czyta go T50 x1x (import z TRÓJKI) i skrypty PC (apka_trojka_do_wszystkich_50)
  const payload = { app: 'v13_troika', source: 'T50 RAZEM', version: APP_VER,
    saved: new Date().toISOString(), n: codes.length, codes };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  lsSet(LS.lastbk, `${new Date().toLocaleString('pl-PL')} · n=${codes.length}`);
  toast(auto ? `Auto-kopia: ${name}` : `Zapisano ${name}`);
  if (homeView === 'dane' && cur === 'dane') renderDane();
}
function importFile(d, fname) {
  syncAdded(true);
  const raw = Array.isArray(d) ? d : d && d.codes;
  if (!Array.isArray(raw)) throw new Error('w pliku nie ma listy kodów (codes)');
  const arr = raw.map(x => String(x == null ? '' : x).trim().padStart(3, '0'));
  const badI = arr.findIndex(c => !VALID.has(c));
  if (badI >= 0) throw new Error(`niepoprawny kod „${arr[badI]}” w Nr ${badI + 1}`);
  const all = allCodes(), n = Math.min(arr.length, all.length);
  for (let i = 0; i < n; i++) if (arr[i] !== all[i])
    throw new Error(`różnica w Nr ${i + 1}: plik ${arr[i]}, aplikacja ${all[i]}. Nic nie zmieniono.`);
  if (arr.length <= all.length) { alert(`Plik ${fname} (${arr.length} kodów, ${d.kind || 'bez kind'}) jest zgodny, ale nie ma nowych kodów.\nAplikacja ma ${all.length}. Nic nie zmieniono.`); return; }
  const gain = arr.length - all.length;
  if (!confirm(`Import ${fname}\nrodzaj: ${d.kind || '—'} · ${arr.length} kodów\nzgodny z aplikacją w Nr 1–${all.length}\n\nDopisać ${gain} nowych kodów do WSZYSTKICH tabel?`)) return;
  added = arr.slice(SEED_N); saveAdded(); writeAppKeys();
  for (const a of APPS) { try { W(a.k).sync(); } catch (e) { console.error(e); } }
  checkSync();
  lsSet(LS.lastimp, `${d.kind || 'plik'} · ${new Date().toLocaleString('pl-PL')} · n=${arr.length} · +${gain}`);
  refresh(); toast(`Zaimportowano +${gain} kodów, teraz n=${fmtN(allCodes().length)}`, 5000);
}
$('fileIn').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { importFile(JSON.parse(rd.result), f.name); } catch (err) { alert('Import przerwany, nic nie zmieniono:\n' + err.message); } };
  rd.readAsText(f);
};
let testOut = '';
function renderDane() {
  const auto = lsGet(LS.autobk, '1') === '1';
  $('home').innerHTML = `<div class="card"><h2>Dane</h2><table class="stt"><tbody>
    <tr><td>Kody razem</td><td>${fmtN(allCodes().length)}</td></tr>
    <tr><td>Seed (Test50, od Nr 1)</td><td>${fmtN(SEED_N)}</td></tr>
    <tr><td>Dopisane w aplikacji</td><td>${fmtN(added.length)}</td></tr>
    <tr><td>Ostatni import</td><td>${esc(lsGet(LS.lastimp, '—'))}</td></tr>
    <tr><td>Ostatnia kopia</td><td>${esc(lsGet(LS.lastbk, '—'))}</td></tr>
    <tr><td>Wersja</td><td>${APP_VER}</td></tr></tbody></table>
    <div class="row"><button class="btn pri" id="exp">⬇ Eksport JSON (TRÓJKA)</button><button class="btn" id="imp">⬆ Import JSON</button></div>
    <label class="sw"><input type="checkbox" id="auto" ${auto ? 'checked' : ''}> Auto-kopia co 10 kodów</label>
    <div class="small">Eksport ma format TRÓJKI: plik <b>v13_RRRRMMDD_HHMM_NNNNNkod.json</b>, <b>app: v13_troika</b>, pełny ciąg od Nr 1. Na PC jak dotąd: <b>apka_trojka_do_wszystkich_50</b>.<br>
    Import przyjmuje JSON z każdej aplikacji Test50 (TRÓJKA, T50 x1x 1T/200/2T, x1x 2-slot). Jeśli ciąg różni się choć w jednym wierszu, import się zatrzymuje i nic nie zmienia.</div></div>
  <div class="card"><h2>Test zgodności silników</h2><div class="row"><button class="btn" id="tst">Uruchom test (seed)</button></div><div id="tout">${testOut}</div></div>
  <div class="card"><h2>Tabele w aplikacji</h2><table class="stt"><tbody>${APPS.map(a => `<tr><td>${a.name}</td><td>${a.ver}</td></tr>`).join('')}</tbody></table>
    <div class="row"><button class="btn warn" id="rst">Usuń dopisane kody</button></div></div>`;
  $('exp').onclick = () => exportJSON(false);
  $('imp').onclick = () => $('fileIn').click();
  $('auto').onchange = e => lsSet(LS.autobk, e.target.checked ? '1' : '0');
  $('tst').onclick = () => {
    $('tout').innerHTML = '<div class="small">liczę…</div>';
    setTimeout(() => {
      testOut = APPS.map(a => { let r; try { r = W(a.k).selfTest(); } catch (e) { r = { ok: false, txt: e.message }; } return `<div class="${r.ok ? 'ok' : 'er'}">${r.ok ? '✓' : '✗'} <b>${a.short}</b> · ${esc(r.txt)}</div>`; }).join('');
      $('tout').innerHTML = testOut;
    }, 30);
  };
  $('rst').onclick = () => {
    if (!added.length) return toast('Nie ma dopisanych kodów.');
    if (!confirm(`Usunąć ${added.length} dopisanych kodów ze WSZYSTKICH tabel?`)) return;
    if (!confirm('Na pewno? Zrób najpierw eksport JSON.')) return;
    added = []; saveAdded(); writeAppKeys();
    for (const a of APPS) { try { W(a.k).sync(); } catch (e) {} }
    refresh(); toast('Usunięto dopisane kody.');
  };
}

window.addEventListener('resize', layout);
layout();
buildFrames();
</script>
</body>
