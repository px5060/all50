<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#101626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="x1x 2-SLOT">
<title>x1x 2-slot — Test50 · A / C</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
:root{
  --bg:#11161D; --panel:#19212C; --panel2:#212B38; --line:#2E3B4B;
  --txt:#E6EDF5; --dim:#8FA0B4; --gold:#E8B25C; --gold-dk:#7A5A20;
  /* paleta CZERWONA — z Excela, nie zmieniać */
  --e-trig:#C00000; --e-krok:#FFF2CC; --e-start:#9933FF; --e-win:#00B050;
  --e-loss:#000000; --e-ign:#A6A6A6;
  /* baza 2-slot */
  --b-build:#BDD7EE; --b-k1:#FFE699; --b-k2:#F4B084; --b-win:#C6EFCE; --b-skip:#F2F2F2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--txt);
  font:400 14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ── HEADER ── */
header{background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
.hrow{display:flex;align-items:center;gap:8px;padding:7px 10px}
.brand{font-size:11px;letter-spacing:.10em;text-transform:uppercase;color:var(--dim);flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b{color:var(--gold);font-weight:600}
.iconbtn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  width:34px;height:30px;border-radius:7px;font-size:15px;display:grid;place-items:center}

/* zakładki STRATEGII (A / C) */
.strat{display:flex;gap:6px;padding:0 10px 6px}
.strat .st{flex:1;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
  color:var(--dim);font-weight:800;font-size:13px;letter-spacing:.04em}
.strat .st.on{background:var(--gold);border-color:var(--gold);color:#1A1206}
.strat .st small{display:block;font-size:9px;font-weight:500;letter-spacing:0;opacity:.75;margin-top:1px}

/* zakładki MODELI (scroll poziomy) */
.mtabs{display:flex;gap:6px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none}
.mtabs::-webkit-scrollbar{display:none}
.mtab{flex:0 0 auto;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
  color:var(--dim);font-weight:700;font-size:12px;white-space:nowrap}
.mtab.on{background:var(--gold);border-color:var(--gold);color:#1A1206}
.mtab small{font-size:9px;font-weight:500;opacity:.75;margin-left:3px}

#warn{background:#4A1F1F;color:#FFD5D5;font-size:11px;padding:6px 10px;text-align:center;display:none}
#bak{background:#4A3B12;color:#FFE9B8;font-size:11px;padding:7px 10px;text-align:center;display:none}
#bak button{background:var(--gold);border:0;color:#1A1206;font-weight:700;font-size:11px;
  padding:4px 11px;border-radius:6px;margin-left:8px}

/* ── PULPIT ── */
#pulpit{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
  padding:8px 10px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
#pulpit::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;min-width:120px;background:var(--panel2);border:1px solid var(--line);
  border-left:3px solid var(--gold-dk);border-radius:8px;padding:6px 9px;
  cursor:pointer;transition:transform .1s,background .1s}
.card:active{transform:scale(.96);background:var(--panel)}
.card .lbl{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.card .val{font-size:13px;font-weight:700;margin-top:2px;white-space:nowrap}
.card.play{border-left-color:#00B050}   .card.play .val{color:#6EE7A0}
.card.start{border-left-color:#9933FF}  .card.start .val{color:#C9A0FF}
.card.wait{border-left-color:#C08A2A}   .card.wait .val{color:#E8B25C}
.card.base{border-left-color:#3B82C4}   .card.base .val{color:#8FC7FF}

/* ── TABELA (biały motyw, jak V1.3) ── */
#tw{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;background:#fff;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;table-layout:fixed;color:#000}
thead th{position:sticky;top:0;z-index:2;background:#DDEBF7;color:#1F3864;
  font-size:9px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
  padding:5px 3px;border-bottom:1px solid #9BB7D4;border-right:1px solid #C6D5E6;text-align:center}
tbody td{border-bottom:1px solid #E3E8EE;border-right:1px solid #E3E8EE;padding:4px 3px;
  font-size:10.5px;vertical-align:middle;word-break:break-word;text-align:center;color:#000}
.c-nr{width:40px;color:#3C4A5A;font-size:9px;font-weight:700;
  white-space:nowrap;word-break:normal;padding-left:2px;padding-right:2px}
.c-kod{width:42px;font-weight:700;font-size:12px;letter-spacing:.06em}
.c-rola{width:82px;text-align:left;padding-left:4px;font-size:9.5px;line-height:1.25}
.c-k{width:22px;font-weight:700;font-size:12px}
.c-mod{width:auto;text-align:left;padding-left:5px;font-size:9.5px;line-height:1.3;font-weight:700}
tbody tr.hit .c-kod{color:#B00000}
#empty{padding:40px 24px;text-align:center;color:#7B8794;font-size:13px;line-height:1.6}
#more{width:100%;padding:11px;background:#EEF3F9;border:0;border-bottom:1px solid #D5DFEA;
  color:#40566E;font-size:12px;font-weight:600}

/* ── FOOTER / KLAWIATURA ── */
footer{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);padding:7px 10px 9px}
.frow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.hint{flex:1;font-size:11.5px;color:var(--dim)}
.hint b{color:var(--txt)}
.tgl{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  font-size:11px;font-weight:700;padding:5px 10px;border-radius:7px}
.tgl.on{background:var(--gold);border-color:var(--gold);color:#1A1206}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.key{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  font-family:ui-monospace,monospace;font-size:16px;font-weight:700;letter-spacing:.06em;
  padding:11px 0;border-radius:9px}
.key:active{background:var(--gold);color:#1A1206}
.key.x1x{border-color:var(--gold-dk);color:var(--gold)}
.key.und{grid-column:1/-1;background:#3A2A2A;border-color:#5A3A3A;color:#FFD5D5;font-family:inherit;
  font-size:13px;font-weight:600;letter-spacing:0}

/* ── TOAST ── */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);
  transform:translateX(-50%) translateY(10px);background:#0A0F16;border:1px solid var(--line);
  color:var(--txt);font-size:13px;padding:9px 15px;border-radius:9px;opacity:0;pointer-events:none;
  transition:.2s;z-index:50;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── MENU (overlay) ── */
#ovl{position:fixed;inset:0;background:rgba(4,8,12,.6);z-index:60;display:none}
#ovl.on{display:block}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:86%;overflow:auto;
  background:var(--panel);border-top-left-radius:16px;border-top-right-radius:16px;
  padding:16px 15px calc(env(safe-area-inset-bottom) + 18px)}
#sheet h2{margin:0 0 12px;font-size:16px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:9px}
.stat h3{margin:0 0 7px;font-size:12.5px;color:var(--gold)}
.stat .r{display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0;color:var(--dim)}
.stat .r b{color:var(--txt);font-variant-numeric:tabular-nums}
.mi{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  font-size:13.5px;font-weight:600;padding:12px;border-radius:9px;margin-bottom:7px;text-align:left}
.mi:active{background:var(--panel)}
.sw{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);
  border:1px solid var(--line);padding:12px 13px;border-radius:9px;margin-bottom:7px;font-size:14px}
.sw .kn{width:44px;height:26px;border-radius:13px;background:#39485A;border:0;position:relative;flex:0 0 auto}
.sw .kn::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#8FA0B4;transition:.15s}
.sw .kn.on{background:var(--gold)}
.sw .kn.on::after{left:21px;background:#1A1206}
.ver{text-align:center;font-size:11px;color:var(--dim);margin-top:10px}
.ver b{color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header>
  <div class="hrow">
    <div class="brand">x1x <b>2-SLOT</b> · Test50 · progresja K8</div>
    <button class="iconbtn" id="btnMenu" aria-label="Menu">☰</button>
  </div>
  <div class="strat">
    <button class="st on" data-s="C">Strategia C <small>Wszystkie · 3 modele</small></button>

  </div>
  <div class="mtabs" id="mtabs"></div>
</header>

</div>

<footer>
  <div class="frow">
    <div class="hint" id="hint">—</div>
    <button class="tgl" id="tFil">tylko eventy</button>
  </div>
  <div class="pad" id="pad"></div>
</footer>

<div id="ovl"><div id="sheet">
  <h2>Statystyki i dane</h2>
  <div id="statBox"></div>
  <div class="sw"><span>Auto-kopia co 10 kodów</span><button class="kn on" id="swAuto"></button></div>
  <button class="mi" id="miExp">Eksportuj kopię (.json)</button>
  <button class="mi" id="miImp">Wczytaj kopię (.json)</button>
  <button class="mi" id="miPersist">Poproś o trwały magazyn</button>
  <button class="mi" id="miClear" style="color:#FF9B9B">Wyczyść wszystkie kody</button>
  <input type="file" id="fileInp" accept=".json,application/json" style="display:none">
  <div class="ver" id="verTxt"></div>
</div></div>

<div id="toast"></div>

/* =====================================================================
   x1x 2-slot — logika apki
   Dwie strategie: C (Wszystkie, 3 modele) i A (Ignoruj, 7 modeli).
   Oba silniki zwalidowane zero-diff z Excelem.
   ===================================================================== */
const APP_VER='1.0.2';
const APP_DATE='2026-08-21';
const $=id=>document.getElementById(id);
const isX1x=c=>!!c && c.length>=3 && c[1]==='1';

/* ---- definicje modeli ---- */
const MODELS={
  C:[
    {name:'M5O3', K:5, offset:3},
    {name:'M6O10',K:6, offset:10},
    {name:'M7O5', K:7, offset:5},
  ],
  A:[
    {name:'M6O10', K:6, offset:10},
    {name:'M7O1',  K:7, offset:1},
    {name:'M9O9',  K:9, offset:9},
    {name:'M9O11', K:9, offset:11},
    {name:'M10O7', K:10,offset:7},
    {name:'M10O8', K:10,offset:8},
    {name:'M10O11',K:10,offset:11},
  ],
};
const MAX_KROKI=8;

/* kolory eventów (paleta CZERWONA z Excela) */
const EV_STYLE={
  trigger:['#C00000','#FFFFFF'],
  krok:   ['#FFF2CC','#000000'],
  start:  ['#9933FF','#FFFFFF'],
  win:    ['#00B050','#FFFFFF'],
  loss:   ['#000000','#FFFFFF'],
  ignored:['#A6A6A6','#000000'],
};
const EV_PRIO_C=['loss','win','start','trigger','krok'];
const EV_PRIO_A=['loss','win','start','trigger','ignored','krok'];
/* kolory bazy 2-slot */
const BASE_FILL={BUILDUP:'#BDD7EE','krok1 miss':'#FFE699','krok2 miss':'#F4B084',WIN:'#C6EFCE',SKIP:'#F2F2F2'};
const BASE_TXT={BUILDUP:'BUILDUP',
  'krok1 miss':'krok1 miss','krok2 miss':'krok2 miss',WIN:'✓ WIN',SKIP:'SKIP'};

/* ---- automat 2-slot (wspólny) ---- */
function process2slot(two, code){
  const isX=isX1x(code);
  if(two.phase==='WAITING'){
    if(isX){ two.phase='SLOT1'; return {role:'BUILDUP',K:null}; }
    return {role:'SKIP',K:null};
  }
  if(two.phase==='SLOT1'){
    if(isX){ const Kw=two.K+1; two.K=0; two.phase='SLOT1'; return {role:'WIN',K:Kw}; }
    two.phase='SLOT2'; return {role:'krok1 miss',K:null};
  }
  // SLOT2
  if(isX){ const Kw=two.K+2; two.K=0; two.phase='SLOT1'; return {role:'WIN',K:Kw}; }
  two.K+=2; two.phase='WAITING'; return {role:'krok2 miss',K:null};
}

/* =====================================================================
   SILNIK C — Strategia Wszystkie (każdy model własny licznik, wiele okien)
   ===================================================================== */
function runEngineC(codes){
  const M=MODELS.C;
  const two={phase:'WAITING',K:0};
  const models={}; M.forEach(m=>models[m.name]={windows:[],closed:0,total:0});
  const counters={}; M.forEach(m=>counters['K'+m.K]=0);
  const rows=[]; // per kod: {role, K, cells:{name:{text,prio}}}
  // openWindows snapshot per model (do pulpitu) — bierzemy stan końcowy
  for(let i=0;i<codes.length;i++){
    const code=codes[i];
    const base=process2slot(two, code);
    const cells={}; M.forEach(m=>cells[m.name]={events:[],prio:null});
    if(base.role==='WIN'){
      const Kw=base.K;
      // K1 zamknięcia
      for(const m of M){
        const ms=models[m.name]; const keep=[];
        for(const w of ms.windows){
          if(!w.started){keep.push(w);continue;}
          if(Kw<=MAX_KROKI) cells[m.name].events.push(['win',`✓ WIN K=${Kw} [T:${w.tn}]`]);
          else cells[m.name].events.push(['loss',`✗ LOSS K=${Kw} [T:${w.tn}]`]);
          ms.closed++;
        }
        ms.windows=keep;
      }
      // K2 posuwanie
      for(const m of M){
        for(const w of models[m.name].windows){
          if(w.started) continue;
          w.krok++; w.eventEr=i+1;
          if(w.krok<m.offset) cells[m.name].events.push(['krok',`· krok ${w.krok} [T:${w.tn}]`]);
          else {w.started=true; cells[m.name].events.push(['start',`★ START [T:${w.tn}]`]);}
        }
      }
      // K3 nowy trigger — per model własny K
      for(const m of M){
        if(m.K!==Kw) continue;
        counters['K'+m.K]++;
        const tn=counters['K'+m.K];
        models[m.name].windows.push({tn,krok:0,started:false,er:i+1,eventEr:i+1});
        models[m.name].total++;
        const ev=['trigger',`▶ TRIGGER #${tn} K=${Kw}`];
        let ins=cells[m.name].events.length;
        for(let k=0;k<cells[m.name].events.length;k++) if(cells[m.name].events[k][0]==='krok'){ins=k;break;}
        cells[m.name].events.splice(ins,0,ev);
      }
      // K4 prio
      for(const m of M){
        const evs=cells[m.name].events; if(!evs.length) continue;
        for(const p of EV_PRIO_C) if(evs.some(e=>e[0]===p)){cells[m.name].prio=p;break;}
      }
    }
    rows.push({role:base.role,K:base.K,cells,code});
  }
  return {rows, models, two, M};
}

/* =====================================================================
   SILNIK A — Strategia Ignoruj (stan per K, jedno okno per K)
   ===================================================================== */
function runEngineA(codes){
  const M=MODELS.A;
  const two={phase:'WAITING',K:0};
  const models={}; M.forEach(m=>models[m.name]={windows:[],closed:0,total:0});
  // grupy per K
  const KG={}; M.forEach(m=>(KG[m.K]||(KG[m.K]=[])).push(m.name));
  const kcount={}, kactive={};
  Object.keys(KG).forEach(k=>{kcount[k]=0;kactive[k]=null;});
  const recompute=()=>{
    for(const k of Object.keys(KG)){
      let a=null;
      for(const nm of KG[k]) for(const w of models[nm].windows)
        a = a===null ? w.tn : Math.max(a,w.tn);
      kactive[k]=a;
    }
  };
  const rows=[];
  for(let i=0;i<codes.length;i++){
    const code=codes[i];
    const base=process2slot(two, code);
    const cells={}; M.forEach(m=>cells[m.name]={events:[],prio:null});
    if(base.role==='WIN'){
      const Kw=base.K;
      // K1 zamknięcia
      for(const m of M){
        const ms=models[m.name]; const keep=[];
        for(const w of ms.windows){
          if(!w.started){keep.push(w);continue;}
          if(Kw<=MAX_KROKI) cells[m.name].events.push(['win',`✓ WIN K=${Kw} [T:${w.tn}]`]);
          else cells[m.name].events.push(['loss',`✗ LOSS K=${Kw} [T:${w.tn}]`]);
          ms.closed++;
        }
        ms.windows=keep;
      }
      recompute();
      // K2 posuwanie
      for(const m of M){
        for(const w of models[m.name].windows){
          if(w.started) continue;
          w.krok++; w.eventEr=i+1;
          if(w.krok<m.offset) cells[m.name].events.push(['krok',`· krok ${w.krok} [T:${w.tn}]`]);
          else {w.started=true; cells[m.name].events.push(['start',`★ START [T:${w.tn}]`]);}
        }
      }
      // K3 trigger vs IGNORED per K
      for(const k of Object.keys(KG)){
        if(Kw!==Number(k)) continue;
        const names=KG[k]; const active=kactive[k];
        if(active!==null){
          for(const nm of names) cells[nm].events.push(['ignored',`⊘ IGNORED K=${Kw} (T:${active} aktywny)`]);
        }else{
          kcount[k]++; const tn=kcount[k];
          for(const nm of names){
            models[nm].windows.push({tn,krok:0,started:false,er:i+1,eventEr:i+1});
            models[nm].total++;
            const ev=['trigger',`▶ TRIGGER #${tn} K=${Kw}`];
            let ins=cells[nm].events.length;
            for(let x=0;x<cells[nm].events.length;x++) if(cells[nm].events[x][0]==='krok'){ins=x;break;}
            cells[nm].events.splice(ins,0,ev);
          }
          recompute();
        }
      }
      // K4 prio
      for(const m of M){
        const evs=cells[m.name].events; if(!evs.length) continue;
        for(const p of EV_PRIO_A) if(evs.some(e=>e[0]===p)){cells[m.name].prio=p;break;}
      }
    }
    rows.push({role:base.role,K:base.K,cells,code});
  }
  return {rows, models, two, M, kactive};
}

let codes=[];               // wspólny ciąg kodów
let strat='C';              // aktywna strategia
let cur='M5O3';             // aktywny model
let engine=null;            // wynik runEngine* dla aktywnej strategii
let engineOther=null;       // druga strategia (do statystyk w tle) — liczona leniwie
let filterOn=false;
let shown=60; const PAGE=60;
const LSKEY='x1x_2slot_codes_v1';
let canStore=true, persistOK='—', autoBackup=true, lastBackupN=0;

function recompute(){
  engine = strat==='C' ? runEngineC(codes) : runEngineA(codes);
}
function modelsForStrat(){ return MODELS[strat]; }
function curModelDef(){ return modelsForStrat().find(m=>m.name===cur); }

/* ---- statystyki per model ---- */
function statsFor(eng, name){
  const md=eng.M.find(m=>m.name===name);
  let trig=0,win=0,loss=0,ign=0;
  for(const r of eng.rows){
    const evs=(r.cells[name]||{}).events||[];
    for(const [tag] of evs){
      if(tag==='trigger') trig++;
      else if(tag==='win') win++;
      else if(tag==='loss') loss++;
      else if(tag==='ignored') ign++;
    }
  }
  const open=eng.models[name].windows.length;
  const games=win+loss;
  const wr=games?100*win/games:0;
  return {trig,win,loss,ign,open,games,wr};
}

function renderPulpit(){
  const p=$('pulpit'); p.innerHTML='';
  const card=(cls,lbl,val,jumpEr)=>{
    const d=document.createElement('div'); d.className='card '+cls;
    d.innerHTML='<div class="lbl"></div><div class="val"></div>';
    d.children[0].textContent=lbl; d.children[1].textContent=val;
    if(jumpEr) d.onclick=()=>jumpTo(jumpEr);
    p.appendChild(d);
  };
  // stan bazy 2-slot
  const two=engine.two;
  const nice={WAITING:'szukam pary (BUILDUP)',SLOT1:'slot 1 — czekam',SLOT2:'slot 2 — czekam'};
  card('base','Stan bazy · K='+two.K, nice[two.phase]||two.phase);

  // okna aktywne modelu
  const md=curModelDef();
  const ws=engine.models[cur].windows;
  if(!ws.length){ card('','Okna '+cur,'brak aktywnych'); }
  ws.slice().reverse().forEach(w=>{
    const off=md.offset;
    if(w.started)            card('play','#'+w.tn+' · '+cur,'GRA — czeka na WIN', w.eventEr);
    else if(w.krok===off-1)  card('start','#'+w.tn+' · '+cur,'START za 1 WIN', w.eventEr);
    else                     card('wait','#'+w.tn+' · '+cur,'krok '+w.krok+'/'+off, w.eventEr);
  });

  const s=statsFor(engine,cur);
  card('','Gry '+cur, s.games+' · WR '+s.wr.toFixed(0)+'%');
}

function visibleRows(){
  const out=[];
  for(let er=codes.length;er>=1;er--){
    if(filterOn){
      const evs=(engine.rows[er-1].cells[cur]||{}).events||[];
      if(!evs.length) continue;
    }
    out.push(er);
    if(out.length>=shown) break;
  }
  return out.reverse();
}
function countFiltered(){
  let c=0;
  for(let er=1;er<=codes.length;er++){
    const evs=(engine.rows[er-1].cells[cur]||{}).events||[];
    if(evs.length) c++;
  }
  return c;
}

function renderTable(keepScroll){
  const tw=$('tw'), tb=$('tb');
  const atBottom = keepScroll ? false : true;
  tb.innerHTML='';
  if(!codes.length){ $('empty').style.display='block'; return; }
  $('empty').style.display='none';
  const rows=visibleRows();
  const total = filterOn ? countFiltered() : codes.length;
  const frag=document.createDocumentFragment();
  if(rows.length<total){
    const tr=document.createElement('tr'); const td=document.createElement('td');
    td.colSpan=5; td.style.padding='0';
    const b=document.createElement('button'); b.id='more';
    b.textContent='↑ Pokaż wcześniejsze ('+(total-rows.length)+' wierszy)';
    b.onclick=()=>{shown+=PAGE;renderTable(true);};
    td.appendChild(b); tr.appendChild(td); frag.appendChild(tr);
  }
  for(const er of rows){
    const r=engine.rows[er-1];
    const evs=(r.cells[cur]||{}).events||[];
    const prio=(r.cells[cur]||{}).prio;
    const tr=document.createElement('tr');
    if(isX1x(r.code)) tr.className='hit';
    const bg=BASE_FILL[r.role]||'#fff';
    const cell=(cls,txt,style)=>{
      const td=document.createElement('td'); td.className=cls; td.textContent=txt;
      if(style) Object.assign(td.style,style); return td;
    };
    const roleTxt = r.role==='WIN' ? ('✓ WIN'+(r.K!=null?' K='+r.K:'')) : (BASE_TXT[r.role]||r.role);
    tr.appendChild(cell('c-nr',er,{background:bg}));
    tr.appendChild(cell('c-kod mono',r.code,{background:bg}));
    tr.appendChild(cell('c-rola',BASE_TXT[r.role]||r.role,{background:bg,fontWeight:r.role==='WIN'||r.role==='BUILDUP'?'700':'400'}));
    tr.appendChild(cell('c-k',r.K??'',{background:bg}));
    if(evs.length){
      const st=EV_STYLE[prio]||['#FFFFFF','#000000'];
      tr.appendChild(cell('c-mod',evs.map(e=>e[1]).join(' | '),{background:st[0],color:st[1]}));
    }else tr.appendChild(cell('c-mod','',null));
    frag.appendChild(tr);
  }
  tb.appendChild(frag);
  if(atBottom) requestAnimationFrame(()=>{tw.scrollTop=tw.scrollHeight;});
}

function jumpTo(er){
  if(!er||er<1||er>codes.length) return;
  if(filterOn){ filterOn=false; $('tFil').classList.remove('on'); }
  const needed=codes.length-er+1;
  if(shown<needed){ shown=needed+20; }
  renderTable(true);
  requestAnimationFrame(()=>{
    const tb=$('tb'); const idx=visibleRows().indexOf(er);
    if(idx>=0){
      const tr=tb.children[tb.children.length - (visibleRows().length - idx)];
      if(tr){ tr.scrollIntoView({block:'center'}); tr.style.transition='background .4s';
        const old=tr.style.background; tr.style.background='#3A3416';
        setTimeout(()=>{tr.style.background=old;},1400);}
    }
  });
}

function renderHint(){

  $('hint').innerHTML='Kodów: <b>'+codes.length+'</b> · '+cur+': <b>'+s.trig+'</b> trig · <b>'+s.games+'</b> gier';
  $('thMod').textContent=cur+' · K'+curModelDef().K+' · off+'+curModelDef().offset;
}

function renderAll(keep){ renderPulpit(); renderTable(keep); renderHint(); }

}

  const row=(k,v)=>'<div class="r"><span>'+k+'</span><b>'+v+'</b></div>';
  d.innerHTML='<h3>Baza i dane</h3>'+row('Strategia','x1x '+strat)+row('Kodów',codes.length)+
    row('Aktualne K bazy',engine.two.K)+row('Zapis lokalny',canStore?'działa':'NIE działa')+
    row('Trwały magazyn',persistOK)+row('Od ostatniej kopii',(codes.length-lastBackupN)+' kodów');
  b.appendChild(d);
  $('verTxt').innerHTML='x1x 2-slot · wersja <b>'+APP_VER+'</b> · '+APP_DATE;
  $('swAuto').classList.toggle('on',autoBackup);
  $('ovl').classList.add('on');
}
function closeMenu(){ $('ovl').classList.remove('on'); }

function save(){
  if(!canStore) return;
  try{ localStorage.setItem(LSKEY, JSON.stringify(codes)); }
  catch(e){ canStore=false; $('warn').style.display='block'; }
}
function load(){
  try{
    const raw=localStorage.getItem(LSKEY);
    if(raw){ const a=JSON.parse(raw); if(Array.isArray(a)) return a; }
  }catch(e){ canStore=false; $('warn').style.display='block'; }
  return null;
}

function exportJson(){
  const data={app:'x1x-2slot',ver:APP_VER,ts:new Date().toISOString(),n:codes.length,codes};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='x1x_kody_'+codes.length+'_'+Date.now()+'.json';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  lastBackupN=codes.length;
  toast('Wyeksportowano '+codes.length+' kodów');
}
function importJson(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const d=JSON.parse(fr.result);
      let arr=Array.isArray(d)?d:(Array.isArray(d.codes)?d.codes:null);
      if(!arr) throw new Error('zły format');
      arr=arr.map(x=>String(x).trim()).filter(x=>/^\d{3}$/.test(x));
      if(!arr.length) throw new Error('brak poprawnych kodów');
      codes=arr; save(); recompute(); shown=PAGE; renderAll(false);
      lastBackupN=codes.length; closeMenu();
      toast('Wczytano '+codes.length+' kodów');
    }catch(e){ toast('Błąd importu: '+e.message); }
  };
  fr.readAsText(file);
}

function maybeAutoBackup(){
  if(!autoBackup) return;
  if(codes.length-lastBackupN>=10){
    $('bakTxt').textContent='Auto-kopia: '+(codes.length-lastBackupN)+' nowych kodów od ostatniego zapisu';
    $('bak').style.display='block';
  }
}

async function askPersist(){
  if(navigator.storage && navigator.storage.persist){
    const g=await navigator.storage.persist();
    persistOK = g?'włączony':'odmówiony';
    toast(g?'Trwały magazyn włączony':'Android odmówił trwałego magazynu');
  }else{ persistOK='niedostępny'; toast('Trwały magazyn niedostępny'); }
}

/* =====================================================================
   INIT
   ===================================================================== */
function switchStrat(s){
  strat=s; cur=MODELS[s][0].name;
  document.querySelectorAll('.strat .st').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  recompute(); buildMtabs(); shown=PAGE; renderAll(false);
}

function init(){
  // storage test
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }
  catch(e){ canStore=false; $('warn').style.display='block'; }

  const stored=load();
  codes = stored && stored.length ? stored : SEED_CODES();
  lastBackupN=codes.length;
  if(navigator.storage && navigator.storage.persisted)
    navigator.storage.persisted().then(p=>{persistOK=p?'włączony':'nie';});

  recompute(); buildMtabs(); buildPad(); renderAll(false);

  // eventy
  document.querySelectorAll('.strat .st').forEach(b=>b.onclick=()=>switchStrat(b.dataset.s));
  $('btnMenu').onclick=openMenu;
  $('ovl').onclick=e=>{ if(e.target===$('ovl')) closeMenu(); };
  $('tFil').onclick=()=>{ filterOn=!filterOn; $('tFil').classList.toggle('on',filterOn); shown=PAGE; renderTable(false); };
  $('miExp').onclick=exportJson;
  $('miImp').onclick=()=>$('fileInp').click();
  $('fileInp').onchange=e=>{ if(e.target.files[0]) importJson(e.target.files[0]); };
  $('miPersist').onclick=askPersist;
  $('swAuto').onclick=()=>{ autoBackup=!autoBackup; $('swAuto').classList.toggle('on',autoBackup); if(!autoBackup)$('bak').style.display='none'; };
  $('bakBtn').onclick=()=>{ exportJson(); $('bak').style.display='none'; };
  $('miClear').onclick=()=>{
    if(confirm('Usunąć wszystkie '+codes.length+' kodów? Tej operacji nie można cofnąć.')){
      codes=[]; save(); recompute(); shown=PAGE; renderAll(false); closeMenu();
      toast('Wyczyszczono');
    }
  };
}
document.addEventListener('DOMContentLoaded',init);

</script>
</body>
</html>
