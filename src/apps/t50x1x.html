<script>
"use strict";
// =====================================================================
// SILNIKI — porty 1:1 (zero-diff vs Excel):
//   1T  tabela1T_rules.py  → Test50_1T_tabela_empiryczna.xlsx
//   200 tabela200_rules.py → Test50_200cykli_tabela_empiryczna.xlsx
//   2T  tabela2T_rules.py  → Test50_2T_tabela_empiryczna.xlsx
// Każdy silnik w osobnym zakresie (IIFE), wspólny ciąg kodów.
// =====================================================================
const API = 'return { TABLE, MODELS, runAll, forecastNext, computeStats, rankingRow, selfTest, defin, isX1x, ALL8, normalizeCode };';
const ENG = {
  t1:   (function () { // =====================================================================
// engine_t50_1t.js — silnik tabeli Test50_1T_tabela_empiryczna.xlsx
// Port 1:1 z tabela1T_rules.py (simulate / instrukcja / next_row_scenarios /
// statystyki deterministyczne) + ranking_do_gry_50.py (wiersze_1t).
// FSM: CZEKAM NA STEP → STEP OTWARTY → TRIGGER → ZAKŁAD na TRIGGER+offset → CZEKAM NA STEP
// Cel x1x · kurs 3,0 · K8 · stawki 8/8/16/32/64/128/256/512 (progresja trwała między zakładami)
// =====================================================================

const TABLE = {
  key: 't50_1t',
  file: 'Test50_1T_tabela_empiryczna.xlsx',
  title: 'Test50 1T — 8 modeli, pojedynczy trigger, cel x1x, K8',
  nCodesRef: 15227,
  NCTRL: 15217,
};
const CEL = 'x1x', ODDS = 3.0, K = 8;
const ST = [8, 8, 16, 32, 64, 128, 256, 512];
const ALL8 = ['000', '001', '010', '011', '100', '101', '110', '111'];

// kontrola = (zakłady, WIN, BUST, bilans, faza po w.15217) z tabela1T_rules.py
const RAW_MODELS = [
  { id: '0_01',    typ: 'SERIA', STEP: '001∪010∪011∪100∪101', xSTEP: 3, TRIGGER: 'xx1 → x10',       offset: 4 },
  { id: 'E3_0_07', typ: 'SERIA', STEP: '000∪001∪100∪110∪111', xSTEP: 5, TRIGGER: 'xx1 → x0x → x10', offset: 4 },
  { id: 'E3_0_15', typ: 'UKŁAD', STEP: 'x01 → x0x → x1x',     xSTEP: 1, TRIGGER: 'xx0 → x11',       offset: 1 },
  { id: '0_09',    typ: 'SERIA', STEP: '001∪010∪100∪110∪111', xSTEP: 4, TRIGGER: '100 → xx0',       offset: 4 },
  { id: '0_21',    typ: 'UKŁAD', STEP: 'x11 → x1x',           xSTEP: 1, TRIGGER: 'xx0 → xx1',       offset: 1 },
  { id: '0_24',    typ: 'UKŁAD', STEP: '010 → x01 → x00',     xSTEP: 1, TRIGGER: '0xx → 0xx',       offset: 1 },
  { id: 'E3_0_38', typ: 'UKŁAD', STEP: '000 → 001 → x1x',     xSTEP: 1, TRIGGER: 'x0x',             offset: 4 },
  { id: '0_06',    typ: 'UKŁAD', STEP: '101 → xx0',           xSTEP: 1, TRIGGER: 'x1x → 0xx',       offset: 2 },
];
const MODELS = RAW_MODELS.map((m, i) => ({ ...m, m: 'M' + (i + 1) }));

// Statystyki deterministyczne na 15 227 kodach (arkusz STATYSTYKI) — do selfTest
const EXPECTED = {
  'E3_0_38': [246, 100, 100, 0, 40.7, 2528, 2.46, 94.1, 6, 512, 34, 24, 24, 6, 9, 1, 2, 0, 2, 0, 5],
  '0_09':    [312, 119, 119, 0, 38.1, 4696, 2.62, 95.2, 7, 1024, 39, 33, 20, 7, 9, 5, 4, 2, 6, 2, 5],
  '0_24':    [264, 102, 102, 0, 38.6, 4464, 2.59, 91, 7, 1024, 42, 20, 17, 7, 5, 6, 2, 3, 5, 3, 5],
  'E3_0_07': [352, 132, 132, 0, 37.5, 5384, 2.67, 100.5, 7, 1024, 44, 39, 17, 10, 7, 8, 5, 2, 7, 2, 5],
  '0_01':    [453, 165, 165, 0, 36.4, 6120, 2.75, 80.5, 7, 1024, 54, 33, 32, 22, 9, 7, 7, 1, 8, 1, 5],
  'E3_0_15': [330, 121, 121, 0, 36.7, 4936, 2.73, 100.9, 7, 1024, 38, 27, 27, 7, 12, 5, 2, 3, 5, 3, 5],
  '0_06':    [355, 126, 126, 0, 35.5, 5448, 2.82, 81.4, 7, 1024, 40, 29, 20, 13, 10, 7, 5, 2, 7, 2, 5],
  '0_21':    [296, 105, 105, 0, 35.5, 4312, 2.82, 102.6, 7, 1024, 35, 23, 17, 5, 13, 8, 3, 1, 4, 1, 5],
};
const STAT_KEYS = ['zakl', 'cykle', 'W', 'B', 'hit', 'P', 'zc', 'sr', 'ml', 'maxwyl',
  'wk1', 'wk2', 'wk3', 'wk4', 'wk5', 'wk6', 'wk7', 'wk8', 'k6', 'k7', 'okresy'];

// ---------------------------------------------------------------------
// KODY / DOPASOWANIE
// ---------------------------------------------------------------------
function normalizeCode(v) {
  if (v === null || v === undefined) return null;
  const s = String(v).trim();
  if (!/^\d{1,3}(\.0+)?$/.test(s)) return null;
  return String(parseInt(s, 10)).padStart(3, '0');
}
const _mm = new Map();
/** match(p, c) — p = "a∪b", 'x' = dowolna cyfra; kod 'XXX' nigdy nie pasuje. */
function match(p, c) {
  if (c === 'XXX' || c == null) return false;
  const key = p + '|' + c;
  let v = _mm.get(key);
  if (v === undefined) {
    v = p.split('∪').some(q => q.length === c.length && [...q].every((x, i) => x === 'x' || x === c[i]));
    _mm.set(key, v);
  }
  return v;
}
const isX1x = c => match(CEL, c);

function seqmask(pat, codes) {
  const N = codes.length, tr = pat.split(' → '), L = tr.length, m = new Uint8Array(N);
  for (let i = L - 1; i < N; i++) {
    let ok = 1;
    for (let j = 0; j < L; j++) if (!match(tr[j], codes[i - L + 1 + j])) { ok = 0; break; }
    m[i] = ok;
  }
  return m;
}
function extendMask(mask, pat, codes) {           // mask dla codes[0..N-2] + ostatni element
  const N = codes.length, tr = pat.split(' → '), L = tr.length, m = new Uint8Array(N);
  m.set(mask);
  let ok = N >= L ? 1 : 0;
  if (ok) for (let j = 0; j < L; j++) if (!match(tr[j], codes[N - L + j])) { ok = 0; break; }
  m[N - 1] = ok;
  return m;
}

// ---------------------------------------------------------------------
// FSM — simulate(m, codes) jak w Pythonie
// zwraca {d: [zakłady], lab: [[rodzaj, tekst]|null], st: stan po ostatnim wierszu}
// ---------------------------------------------------------------------
const SUM = k => ST.slice(0, k).reduce((a, b) => a + b, 0);
function simulate(m, codes, masks, from) {
  const N = codes.length;
  const sp = masks ? masks.sp : seqmask(m.STEP, codes);
  const tm = masks ? masks.tm : seqmask(m.TRIGGER, codes);
  const x = m.xSTEP, off = m.offset;
  const lab = new Array(N).fill(null), d = [];
  let st = 0, cnt = 0, bs = 0, i = 0, srow = null, pnl = 0, cyc = 1, state = null;
  if (from) { i = from.i; bs = from.bs; pnl = from.pnl; cyc = from.cyc; }   // start od stanu po ostatnim zakładzie (st=0, cnt=0)
  while (i < N) {
    if (st === 0) {
      if (sp[i]) {
        cnt += 1;
        if (cnt >= x) { st = 1; srow = i; }
        lab[i] = ['STEP', st ? 'STEP' : `step ${cnt}/${x}`];
      } else cnt = 0;
      i += 1;
    } else if (tm[i]) {
      const bp = i + off;
      if (bp >= N) {
        lab[i] = ['TRIG', `TRIGGER → k${bs + 1} ${ST[bs]} zł na w.${bp + 1}`];
        for (let j = i + 1; j < N; j++) lab[j] = ['WAIT', `przed grą ${bp - j}`];
        state = { faza: 'CZEKA NA MECZ ZAKŁADU', krok: bs + 1, stawka: ST[bs], w_STEP: srow + 1, w_TRIGGER: i + 1, w_ZAKLAD: bp + 1 };
        break;
      }
      const stake = ST[bs], w = isX1x(codes[bp]);
      let res, wyn;
      if (w) { const p = stake * ODDS - SUM(bs + 1); pnl += p; res = 'WIN'; wyn = Math.trunc(p); }
      else if (bs === K - 1) { pnl -= SUM(8); res = 'BUST'; wyn = -SUM(8); }
      else { res = 'przegrana'; wyn = null; }
      d.push({ cykl: cyc, krok: bs + 1, stawka: stake, w_STEP: srow + 1, w_TRIGGER: i + 1, w_ZAKLAD: bp + 1,
               kod: codes[bp], wynik: res, wynik_cyklu: wyn, bilans: Math.trunc(pnl) });
      lab[i] = ['TRIG', `TRIGGER → k${bs + 1} ${stake} zł na w.${bp + 1}`];
      for (let j = i + 1; j < bp; j++)
        lab[j] = ['WAIT', bp - j === 1 ? `GRA NA NASTĘPNYM WIERSZU: k${bs + 1} ${stake} zł` : `przed grą ${bp - j}`];
      lab[bp] = [{ WIN: 'WIN', BUST: 'BUST', przegrana: 'LOSS' }[res],
                 res === 'WIN' ? `k${bs + 1} ${stake} zł WIN +${wyn}`
                 : res === 'BUST' ? `k${K} ${stake} zł BUST ${wyn}` : `k${bs + 1} ${stake} zł przegrana`];
      if (w) { bs = 0; cyc += 1; }
      else { bs += 1; if (bs === K) { bs = 0; cyc += 1; } }
      st = 0; cnt = 0; i = bp + 1;
    } else i += 1;
  }
  if (state === null) {
    state = st === 0 ? { faza: 'CZEKAM NA STEP', krok: bs + 1, stawka: ST[bs] }
                     : { faza: 'STEP OTWARTY – czekam na TRIGGER', krok: bs + 1, stawka: ST[bs], w_STEP: srow + 1 };
  }
  state.bilans = Math.trunc(pnl); state.cnt = cnt;
  return { d, lab, st: state };
}

/** Wiersz arkusza modelu: kolumny A–H (wiersz, kod, x1x, etykieta, krok, stawka, wynik, bilans). */
function sheetRows(codes, r) {
  const by = new Map(r.d.map(x => [x.w_ZAKLAD, x]));
  return codes.map((c, i) => {
    const L = r.lab[i], x = by.get(i + 1);
    return [i + 1, c, isX1x(c) ? 1 : null, L ? L[1] : null,
            x ? x.krok : null, x ? x.stawka : null, x ? x.wynik_cyklu : null, x ? x.bilans : null];
  });
}

// ---------------------------------------------------------------------
// INSTRUKCJA / SCENARIUSZE (jak w tabela1T_rules.py)
// ---------------------------------------------------------------------
function modelMasks(m, codes) { return { sp: seqmask(m.STEP, codes), tm: seqmask(m.TRIGGER, codes) }; }

/** Symulacja dla każdego z 8 kodów na wierszu N+1 → [{c, lab, st, d}] */
function resumePoint(d) {                          // FSM jest przyczynowy: po rozliczonym zakładzie st=0, cnt=0
  if (!d.length) return null;
  const x = d[d.length - 1];
  let bs = x.krok - 1, cyc = x.cykl;
  if (x.wynik === 'WIN') { bs = 0; cyc += 1; } else { bs += 1; if (bs === K) { bs = 0; cyc += 1; } }
  return { i: x.w_ZAKLAD, bs, pnl: x.bilans, cyc };
}
function branches(m, codes, masks, d) {
  masks = masks || modelMasks(m, codes);
  const from = d ? resumePoint(d) : null;
  return ALL8.map(c => {
    const c2 = codes.concat([c]);
    const r = simulate(m, c2, { sp: extendMask(masks.sp, m.STEP, c2), tm: extendMask(masks.tm, m.TRIGGER, c2) }, from);
    return { c, L: r.lab[codes.length], st: r.st, d: r.d };
  });
}

function nextRowScenarios(m, st, codes, br) {
  const out = new Map();
  if (st.faza === 'CZEKA NA MECZ ZAKŁADU') return out;
  for (const b of br) {
    const L = b.L; if (!L) continue;
    const txt = L[0] === 'TRIG' ? `TRIGGER → ZAKŁAD k${b.st.krok} ${b.st.stawka} zł na w.${b.st.w_ZAKLAD}` : L[1];
    const key = L[0] + '\u0001' + txt;
    if (!out.has(key)) out.set(key, { kind: L[0], txt, codes: [] });
    out.get(key).codes.push(b.c);
  }
  return out;
}

function instrukcja(m, st, N) {
  const f = st.faza, nx = N + 1;
  if (f === 'CZEKA NA MECZ ZAKŁADU') {
    if (st.w_ZAKLAD === nx) return ['GRAJ', `GRAJ w.${nx}: k${st.krok} ${st.stawka} zł na ${CEL} (kurs ${ODDS})`];
    return ['CZEKAJ', `zakład ustawiony: k${st.krok} ${st.stawka} zł na w.${st.w_ZAKLAD} (za ${st.w_ZAKLAD - N} w.) — nic nie rób do tego wiersza`];
  }
  if (f === 'STEP OTWARTY – czekam na TRIGGER')
    return ['OBSERWUJ', `STEP otwarty (w.${st.w_STEP}) — czekam na TRIGGER = ${m.TRIGGER}; po nim zakład +${m.offset} k${st.krok} ${st.stawka} zł`];
  const uk = m.STEP.includes('→');

function playPlan(r) {
  const plan = new Map(), off = r.m.offset;
  const add = (trigI, betI, k, stake, wyn, pending) => {
    for (let j = trigI; j <= betI; j++) {
      let t, st, tag;
      if (j === betI) {
        if (pending) { t = `GRA x1x · K${k} · ${stake} zł`; st = 'NEXT_BET'; tag = 'G'; }
        else { const w = wyn === 'WIN'; t = `GRA x1x · K${k} → ${w ? 'WIN ✓' : (wyn === 'BUST' ? 'BUST ✗' : 'LOSS ✗')}`; st = w ? 'BET_WIN' : 'BET_LOSS'; tag = w ? 'W' : (wyn === 'BUST' ? 'B' : 'L'); }
      } else if (j === betI - 1) {
        t = (j === trigI ? '▶ TRIGGER · ' : '') + `▼ NASTĘPNY WIERSZ = GRA x1x · K${k} · ${stake} zł`; st = 'NEXT_BET'; tag = '▼';
      } else if (j === trigI) {
        t = `▶ TRIGGER → START GRY na Nr ${betI + 1} (+${off}) · K${k}`; st = 'TRIG_PEND'; tag = 'T';
      } else { t = `start gry za ${betI - j} → Nr ${betI + 1}`; st = 'czek'; tag = String(betI - j); }
      plan.set(j, { t, st, tag, k, stake, trigI, betI, pending, wyn });
    }
  };
  for (const b of r.d) add((b.w_TRIGGER || b.w_T2) - 1, b.w_ZAKLAD - 1, b.krok, b.stawka, b.wynik, false);
  if (r.st.faza === 'CZEKA NA MECZ ZAKŁADU') add((r.st.w_TRIGGER || r.st.w_T2) - 1, r.st.w_ZAKLAD - 1, r.st.krok, r.st.stawka, null, true);
  return plan;
}
function shortTag(L, p) {
  if (p) return { tag: p.tag, st: p.st };
  if (!L) return { tag: '·', st: 'wait' };
  if (L[0] === 'STEP') return L[1] === 'STEP' ? { tag: 'OP', st: 'STEP' } : { tag: 'H' + L[1].split(' ')[1].split('/')[0], st: 'STEP' };
  if (L[0] === 'T1') return { tag: 'T1', st: 'T1' };
  if (L[0] === 'GAP') return { tag: 'P', st: 'GAP' };
  return { tag: L[0][0], st: L[0] };
}

  Etykiety (kolory jak w Excelu): <span style="${sty('STEP')}">H1 step n/x</span><span style="${sty('STEP')}">OP STEP</span><span style="${sty('T1')}">T1</span><span style="${sty('GAP')}">P przerwa minęła</span><span style="${sty('TRIG')}">T TRIGGER/T2 → zakład</span><span style="${sty('WAIT')}">przed grą</span><span style="${sty('WIN')}">WIN</span><span style="${sty('LOSS')}">przegrana</span><span style="${sty('BUST')}">BUST</span> · <b>·</b> nic.
  Kod <b style="color:#9cc7ff">niebieski</b> = x1x. Wiersze przerywane = przyszłe kody gry w toku.</div>`;
  $main.innerHTML = h;
  $main.querySelectorAll('.chips button[data-m]').forEach(b => b.onclick = () => { tabSel = b.dataset.m; tabLimit = 80; tabScroll = 'end'; render(); });
  bindTabSwitch(() => { tabSel = 'ALL'; tabLimit = 80; tabScroll = 'end'; });
  const mb = document.getElementById('more');
  if (mb) mb.onclick = () => { tabLimit += 200; tabScroll = document.documentElement.scrollHeight - window.scrollY; render(); };
  const tw = document.getElementById('tw');
  const chip = $main.querySelector('.chips button[data-m].on'); if (chip) chip.scrollIntoView({ inline: 'center', block: 'nearest' });
  requestAnimationFrame(() => {
    if (tabScroll === 'end') {
      const lastTr = tw.querySelector('tbody tr:last-child'), navH = document.querySelector('nav').offsetHeight;
      window.scrollTo(0, Math.max(0, lastTr.getBoundingClientRect().bottom + window.scrollY - (window.innerHeight - navH) + 12));
    } else if (typeof tabScroll === 'number') window.scrollTo(0, document.documentElement.scrollHeight - tabScroll);
    tabScroll = null;
  });
}

function renderStat() {
  const N = codes.length;
  const stats = results.map(r => computeStats(r, N, statMC ? { mc: true } : {}));
  let h = `<div class="chips">${tabSwitch()}</div><div class="card"><h2>T50 ${LBL[curK]} — zestawienie, ${fmtN(N)} kodów</h2><div class="tw"><table><thead><tr><th>M</th><th>Zakł/WIN</th><th>WR%</th><th>maxL</th><th>Bust</th><th>Bilans</th><th>WF</th>${statMC ? '<th>pkt</th>' : ''}</tr></thead><tbody>`;
  stats.forEach((s, i) => { h += `<tr><td><b>${MODELS[i].m}</b></td><td>${s.zakl}/${s.W}</td><td>${s.hit.toFixed(1)}</td><td>${s.ml}</td><td>${s.B}</td><td class="${s.P >= 0 ? 'pos' : 'neg'}">${zl(s.P)}</td><td>${s.okresy}/5</td>${statMC ? `<td>${s.score}</td>` : ''}</tr>`; });
  const tot = stats.reduce((a, s) => a + s.P, 0);
  h += `<tr><td><b>Σ</b></td><td>${stats.reduce((a, s) => a + s.zakl, 0)}/${stats.reduce((a, s) => a + s.W, 0)}</td><td colspan="3"></td><td><b class="${tot >= 0 ? 'pos' : 'neg'}">${zl(tot)}</b></td><td></td>${statMC ? '<td></td>' : ''}</tr></tbody></table></div>
  <div class="row"><button class="btn" id="mc">${statMC ? 'Ukryj Monte-Carlo' : 'Policz Monte-Carlo (bootstrap/permutacja)'}</button></div>
  ${statMC ? '<div class="muted" style="margin-top:6px">Monte-Carlo: 5000 losowań, własny generator — wynik przybliżony, może różnić się od Excela o ±1 pkt.</div>' : ''}</div>`;
  stats.forEach((s, i) => {
    const m = MODELS[i], rr = rankingRow(results[i], codes);
    const rows = [
      ['Trigger', !m.TRIGGER2 ? 'pojedynczy' : `podwójny, przerwa T1 → T2 ${m.max_przerwa === 'dowolna' ? 'dowolna' : `≤ ${m.max_przerwa} w.`}`],
      ['Zakłady / cykle / WIN / BUST', `${s.zakl} / ${s.cykle} / ${s.W} / ${s.B}`],
      ['Trafienie %', s.hit.toFixed(1)], ['Bilans zł', zl(s.P)],
      ['Zakł./cykl · śr. cykl (w.)', `${s.zc ?? '—'} · ${s.sr ?? '—'}`],
      ['Max seria przegr. · max wyłożone', `${s.ml} · ${s.maxwyl} zł`],
      ['WIN k1…k8', [1, 2, 3, 4, 5, 6, 7, 8].map(j => s['wk' + j]).join(' · ')],
      ['BUST przy K6 / K7', `${s.k6} / ${s.k7}`],
      ['Okresy + (z 5)', `${s.okresy}`],
      ['Część 40%: BUST / bilans', `${s.Bo} / ${zl(s.Po)}`],
      ['Bootstrap P(≤0) · mediana', s.bootP === null ? '— (MC)' : `${s.bootP.toFixed(3)} · ${zl(Math.round(s.bootMed))}`],
      ['Permutacja: mediana BUST', s.permMed === null ? '— (MC)' : String(s.permMed)],
      ['pkt (z 9)', s.score === null ? `— (MC) · bez MC: ${Object.values(s.ptsDet).reduce((a, v) => a + v, 0)}/6` : `<b>${s.score}</b>`],
      ['Obrót zł', fmtN(s.obrot !== undefined ? s.obrot : results[i].d.reduce((a, x) => a + x.stawka, 0))],
      ['Ostatni zakład', esc(rr.ostatni)], [`Gra wirtualna (od w.${TABLE.NCTRL + 1})`, esc(rr.wirt)],
    ];
    h += `<div class="card"><h2>${m.m} · ${m.id}</h2><div class="muted" style="margin:-4px 0 6px">${esc(defin(m))}</div><table class="stt"><tbody>${rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</tbody></table></div>`;
  });
  h += `<div class="card muted">Punkty: bootstrap mediana &gt; 0 (2) · P(straty) &lt; 0,35 (1) · 5/5 okresów na plus (2; 4/5 = 1) · BUST K7 ≤ 3 (2; ≤ 5 = 1) · część 40%: 0 BUST i bilans &gt; 0 (1) · 0 BUST K8 (1). ≥ 7 GRAĆ.</div>`;
  $main.innerHTML = h;
  document.getElementById('mc').onclick = () => { statMC = !statMC; render(); };
  bindTabSwitch(() => window.scrollTo(0, 0));
}

  $main.innerHTML = `<div class="card"><h2>Dane</h2>

  <tr><td>Kody razem</td><td><b>${fmtN(codes.length)}</b></td></tr>

  <tr><td>ostatni import</td><td>${esc(lsGet(LS_LASTIMP, '—'))}</td></tr>
  <tr><td>ostatni backup przy n</td><td>${lsGet(LS_LASTBK, '—')}</td></tr>
  <tr><td>wersja</td><td>${APP_VER}</td></tr></tbody></table>

  <div class="row"><button class="btn pri" id="exp">⬇ Eksport JSON</button></div>
  <div class="row"><button class="btn" id="imp">⬆ Import kopii tej apki (.json)</button></div>

  <div class="card muted"><b>TRÓJKA:</b> w TRÓJCE eksport kopii (plik <b>v13_*_NNNNNkod.json</b>), tu „Import kodów z TRÓJKI” i wybierz ten plik. Numeracja Test50 jest ta sama od Nr 1 — apka sprawdzi część wspólną i weźmie tylko nowe kody. Każda różnica = STOP, nic nie zmienione.<br><br>
  <b>Excel (PC):</b> kody do tabel <b>Test50_1T / _200cykli / _2T_tabela_empiryczna.xlsx</b> dopisuje się na dół arkusza <b>KODY</b> (kol. B) albo przez <b>apka_trojka_do_wszystkich_50</b>, potem <b>dopisz_tabela1T / 200 / 2T.bat</b>. Poprawka kodu w środku ciągu → init + nowy build apki.</div>`;

  document.getElementById('rst').onclick = () => {

    if (!confirm(`Usunąć ${added.length} dopisanych kodów? Najpierw zrób eksport JSON!`)) return;
    if (!confirm('Na pewno? Tego nie da się cofnąć.')) return;
    added = []; saveAdded(); recompute(); render();
  };
  document.getElementById('self').onclick = () => {
    const out = document.getElementById('selfOut');
    const errs = [].concat(...eachEng(k => selfTest(seedArr.slice(0, TABLE.nCodesRef)).map(e => `${LBL[k]}: ${e}`)));
    out.innerHTML = !errs.length ? `✓ OK — statystyki 19 modeli (1T: 8, 200: 5, 2T: 6) na ${fmtN(ENG.t1.TABLE.nCodesRef)} kodach zgodne z arkuszami STATYSTYKI` : '✗ ' + errs.map(esc).join('<br>');
  };

function render() {
  document.getElementById('hdrN').textContent = `n=${fmtN(codes.length)}${added.length ? ` (+${added.length})` : ''}`;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  document.getElementById('entry').style.display = view === 'gra' ? '' : 'none';
  ({ gra: renderGra, tab: renderTab, stat: renderStat, dane: renderDane })[view]();

// ---------------------------------------------------------------------
// AKCJE
// ---------------------------------------------------------------------
let toastT = null;
function toast(html, ms = 3500) {
  const t = document.getElementById('toast');
  t.innerHTML = html; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
}

function addCode(c) {
  added.push(c); saveAdded(); recompute();
  const N = codes.length, i = N - 1, msgs = [];
  eachEng(k => { const P = getPlans(); results.forEach((r, mi) => {
    const p = P[mi].get(i), m = MODELS[mi];
    if (!p) return;
    if (p.betI === i && !p.pending) msgs.push(`<b>${LBL[k]}·${m.m}</b> ${m.id}: GRA K${p.k} → ${p.wyn === 'WIN' ? `<span class="pos">WIN ✓ ${r.d[r.d.length - 1].wynik_cyklu >= 0 ? '+' : ''}${r.d[r.d.length - 1].wynik_cyklu}</span>` : `<span class="neg">${p.wyn === 'BUST' ? 'BUST ✗' : 'LOSS ✗'}</span>`}`);
    else if (p.trigI === i) msgs.push(`<b>${LBL[k]}·${m.m}</b> ${m.id}: ▶ TRIGGER → START GRY na Nr ${p.betI + 1} (+${m.offset}) · K${p.k}`);
  }); });
  const nb = nextBets();
  if (nb.length) msgs.push(`<b style="color:#ff9a4d">▼ NASTĘPNY KOD = GRA x1x: ${nb.map(b => `${b.id} K${b.k} ${b.stake} zł`).join(', ')}</b>`);
  toast(`Nr ${N}: <b>${c}</b>${msgs.length ? '<br>' + msgs.join('<br>') : ''}`, msgs.length ? 5000 : 1500);
  if (navigator.vibrate) navigator.vibrate(nb.length ? [60, 60, 160] : 25);
  render();
  if (lsGet(LS_AUTOBK, '1') === '1' && added.length % 10 === 0) exportJSON(true);
}

function undo() {
  if (!added.length) { toast('Brak dopisanych kodów do cofnięcia (kody z pliku są chronione).'); return; }
  const c = added[added.length - 1];
  if (!confirm(`Cofnąć Nr ${codes.length}: ${c}?`)) return;
  added.pop(); saveAdded(); recompute(); render();
  toast(`Cofnięto Nr ${codes.length + 1}: ${c}`);
}

function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}
function exportJSON(auto) {
  const data = { kind: JSON_KIND, app: 'T50 x1x (1T+200+2T)', version: APP_VER, table: KEYS.map(k => ENG[k].TABLE.file).join(' | '),
                 created: new Date().toISOString(), n: codes.length, seed_n: SEED_N, codes };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${JSON_KIND}_${stamp()}_n${codes.length}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  lsSet(LS_LASTBK, String(codes.length));
  toast(auto ? `Auto-backup: ${a.download}` : `Zapisano ${a.download}`);
}

// ---------------------------------------------------------------------
// IMPORT (TRÓJKA albo kopia tej apki). Plik: {kind|app, codes:[...]} albo sama lista.
//   1) ta sama numeracja → prefiks; 2) inna → szukam końcówki seeda (40 kodów) w pliku.
//   Każda różnica w części wspólnej = STOP. Starszy plik nie kasuje kodów z apki.
//   Zastąpienie kodów z apki tylko po 2 potwierdzeniach.
// ---------------------------------------------------------------------
let impMode = 'kopia';
function alignFile(arr) {
  const n = Math.min(arr.length, SEED_N);
  let firstDiff = -1;
  for (let i = 0; i < n; i++) if (arr[i] !== seedArr[i]) { firstDiff = i; break; }
  if (firstDiff < 0) return { shift: 0, tail: arr.length <= SEED_N ? [] : arr.slice(SEED_N), overlap: n };
  const tail = seedArr.slice(SEED_N - ALIGN_TAIL).join('|'), hits = [];
  for (let p = 0; p + ALIGN_TAIL <= arr.length; p++) {
    if (arr[p] !== seedArr[SEED_N - ALIGN_TAIL]) continue;
    if (arr.slice(p, p + ALIGN_TAIL).join('|') === tail) hits.push(p);
  }
  if (hits.length !== 1)
    throw new Error(`kody pliku różnią się od ciągu apki na Nr ${firstDiff + 1} (plik ${arr[firstDiff]}, apka ${seedArr[firstDiff]})` +
      (hits.length > 1 ? ' i końcówka występuje w pliku kilka razy' : ' — nie znalazłem też końcówki ciągu apki w pliku'));
  const endInFile = hits[0] + ALIGN_TAIL, shift = SEED_N - endInFile, startFile = Math.max(0, -shift);
  for (let f = startFile; f < endInFile; f++)
    if (arr[f] !== seedArr[f + shift])
      throw new Error(shift ? `numeracja przesunięta o ${shift}: różnica na Nr apki ${f + shift + 1} (plik Nr ${f + 1}: ${arr[f]}, apka ${seedArr[f + shift]})`
                           : `różnica na Nr ${f + 1}: plik ${arr[f]}, apka ${seedArr[f]}`);
  return { shift, tail: arr.slice(endInFile), overlap: endInFile - startFile };
}
function importFile(d, fname) {
  const raw = Array.isArray(d) ? d : d && d.codes;
  if (!Array.isArray(raw) || !raw.length) throw new Error('plik nie zawiera listy kodów (pole "codes")');
  const kind = Array.isArray(d) ? '(lista)' : (d.kind || d.app || '?');
  const want = impMode === 'trojka' ? TROJKA_APP : JSON_KIND;
  const okKind = impMode === 'trojka' ? kind === TROJKA_APP : OWN_KINDS.includes(kind);
  if (!okKind && !confirm(`Plik ma kind/app="${kind}", oczekiwano "${want}". Kontynuować?`)) return;
  const arr = raw.map(normalizeCode);
  const bad = arr.findIndex(x => !x || !ALL8.includes(x));
  if (bad >= 0) throw new Error(`nieprawidłowy kod na pozycji ${bad + 1}: ${JSON.stringify(raw[bad])}`);
  const al = alignFile(arr), newAll = al.tail;
  let same = 0;
  while (same < Math.min(added.length, newAll.length) && added[same] === newAll[same]) same++;
  const lose = added.length - same, gain = newAll.length - same;
  if (!gain) { toast(`Import: brak nowych kodów — plik ma ${arr.length} kodów, apka ${codes.length}${lose ? ' (plik starszy, kody z apki zostają)' : ''}.`, 5000); return; }
  let msg = `Import ${impMode === 'trojka' ? 'z TRÓJKI' : 'kopii T50'}: ${fname}\n` +
            `Plik: ${arr.length} kodów${al.shift ? ` (numeracja przesunięta o ${al.shift > 0 ? '+' : ''}${al.shift})` : ''}\n` +
            `Zgodna część wspólna: ${al.overlap} kodów\n` +
            `Apka teraz: ${codes.length} → po imporcie: ${SEED_N + newAll.length}\n` +
            `Nowe kody: ${gain} (Nr ${SEED_N + same + 1}–${SEED_N + newAll.length})`;
  if (lose) msg += `\n\n⚠ UWAGA: ${lose} kodów wpisanych w apce (od Nr ${SEED_N + same + 1}) nie zgadza się z plikiem — zostaną zastąpione.`;
  if (!confirm(msg + '\n\nOK?')) return;
  if (lose && !confirm(`Na pewno zastąpić ${lose} kodów z apki?`)) return;
  added = newAll.slice(); saveAdded(); recompute();
  lsSet(LS_LASTIMP, `${impMode === 'trojka' ? 'TRÓJKA' : 'kopia'} · ${new Date().toLocaleString('pl-PL')} · n=${codes.length} · +${gain}`);
  render();
  const nb = nextBets();
  toast(`Zaimportowano: +${gain} kodów, teraz n=${codes.length}` +
        (nb.length ? `<br><b style="color:#ff9a4d">▼ NASTĘPNY KOD = GRA x1x: ${nb.map(b => `${b.id} K${b.k} ${b.stake} zł`).join(', ')}</b>` : ''), 6000);
}
document.getElementById('fileIn').onchange = e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { importFile(JSON.parse(rd.result), f.name); } catch (err) { alert('Import przerwany, nic nie zmieniono:\n' + err.message); } };
  rd.readAsText(f);
};

const $in = document.getElementById('codeIn');
const VALID = new Set(ALL8);
function submitCode() {
  const v = $in.value.trim();
  if (!v) return;
  if (v.length !== 3 || !VALID.has(v)) {
    $in.classList.remove('bad'); void $in.offsetWidth; $in.classList.add('bad');
    toast(`„${esc(v)}” to nie jest kod z ciągu Test50 (3 cyfry 0/1: 000…111).`);
    $in.select(); return;
  }
  $in.value = ''; $in.classList.remove('bad');
  addCode(v);
  $in.focus();
}
$in.addEventListener('input', () => {
  $in.value = $in.value.replace(/\D/g, '').slice(0, 3);
  $in.classList.remove('bad');
  if ($in.value.length === 3) submitCode();
});
$in.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submitCode(); } });
document.getElementById('addBtn').onclick = submitCode;
document.getElementById('undo').onclick = () => { undo(); $in.focus(); };
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { view = b.dataset.v; if (view === 'tab') { tabLimit = 80; tabScroll = 'end'; } render(); if (view !== 'tab') window.scrollTo(0, 0); });

function setHH() { document.documentElement.style.setProperty('--hh', document.querySelector('header').offsetHeight + 'px'); }
setHH(); window.addEventListener('resize', setHH);
useEng('t1');
recompute();
render();
</script>
