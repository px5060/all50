<style>
:root{
  --bg:#11161D; --panel:#19212C; --panel2:#212B38; --line:#2E3B4B;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--txt);

.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ── HEADER ── */
header{background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
.hrow{display:flex;align-items:center;gap:8px;padding:7px 10px}
.brand{font-size:11px;letter-spacing:.10em;text-transform:uppercase;color:var(--dim);flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b{color:var(--gold);font-weight:600}
.iconbtn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  width:34px;height:30px;border-radius:7px;font-size:15px;display:grid;place-items:center}
.tabs{display:flex;gap:6px;padding:0 10px 8px}
.tab{flex:1;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
  color:var(--dim);font-weight:700;font-size:13px;letter-spacing:.03em}
.tab.on{background:var(--gold);border-color:var(--gold);color:#1A1206}
.tab small{display:block;font-size:9.5px;font-weight:500;letter-spacing:0;opacity:.75;margin-top:1px}

/* ── PULPIT ── */
#pulpit{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
  padding:8px 10px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
#pulpit::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;min-width:118px;background:var(--panel2);border:1px solid var(--line);
  border-left:3px solid var(--gold-dk);border-radius:8px;padding:6px 9px;
  cursor:pointer;transition:transform .1s,background .1s}
.card:active{transform:scale(.96);background:var(--panel)}
.card.clk{pointer-events:auto}
.card .lbl{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.card .val{font-size:13px;font-weight:700;margin-top:2px;white-space:nowrap}
.card.hot{border-left-color:#9933FF}
.card.hot .val{color:#C9A0FF}
.card.now{border-left-color:#00B050}
.card.now .val{color:#6EE7A0}
.card.base{border-left-color:var(--gold)}
.card.base .val{color:var(--gold)}

td{border-bottom:1px solid #E3E8EE;border-right:1px solid #E3E8EE;padding:4px 3px;

.c-rola{width:74px;text-align:left;padding-left:4px;font-size:9.5px;line-height:1.25}
.c-k{width:20px;font-weight:700;font-size:12px}
.c-mod{width:auto;text-align:left;padding-left:5px;font-size:9.5px;line-height:1.3;font-weight:700}
tr.hit .c-kod{color:#B00000}
tr.flash td{animation:flashRow 2s ease-out}
@keyframes flashRow{0%{background-color:#FFEB99!important}100%{}}
#more{width:100%;padding:11px;background:#EEF3F9;border:0;border-bottom:1px solid #D5DFEA;

#empty{padding:40px 24px;text-align:center;color:#7B8794;font-size:13px;line-height:1.6}

<script>
/* =====================================================================
   SILNIK V1.3 — port 1:1 z v13_troika_rules.py, zwalidowany zero-diff
   na 14911 kodach (0 różnic w kolumnach C/D/F/G).
   ===================================================================== */
const OFFSET=7, START_STEP=6, K_LIMIT=8;
const MODELS=[{name:'T1',trig:new Set([1])},{name:'T2',trig:new Set([2])}];
const EVENT_PRIORITY=['loss','win','trigger','start','krok','gra'];
const BASE_FILL={'para':'#FFE699','SPRAWDŹ':'#F4B084','WIN':'#C6EFCE','miss':'#FCE4D6','SKIP':'#F2F2F2'};
const MODEL_STYLE={trigger:['#C00000','#FFFFFF'],krok:['#FFF2CC','#000000'],start:['#9933FF','#FFFFFF'],
                   win:['#00B050','#FFFFFF'],loss:['#FF0000','#FFFFFF'],gra:['#BDD7EE','#000000']};
const profit=M=>M<=K_LIMIT?8*(Math.pow(2,M-1)+1):-2040;
const isX1x=c=>c!=null&&c.length===3&&c[1]==='1';
function toCode(v){if(v==null)return null;const s=String(v).trim();if(s==='')return null;
  return /^-?\d+(\.\d+)?$/.test(s)?String(parseInt(Number(s),10)).padStart(3,'0'):s.padStart(3,'0');}

class V13Model{
  constructor(raw){
    this.codes=raw.map(toCode); this.N=this.codes.length;
    this.rowRole={}; this.rowModel={}; this.games={T1:[],T2:[]};
    this.openCount={T1:0,T2:0}; this.trigTotal={T1:0,T2:0};
    this.winCycles=[]; this.cycleParas={}; this.openWindows={T1:[],T2:[]};
    for(let er=1;er<=this.N;er++) this.rowModel[er]={};
    this._base(); this._models();
  }
  _base(){
    let state='SEEK',K=1,pend=null,paras=[];
    for(let i=0;i<this.N;i++){
      const er=i+1, code=this.codes[i], hit=isX1x(code);
      if(code===null){this.rowRole[er]={txt:'SKIP',K:null,bk:'SKIP',bold:false};continue;}
      if(state==='IGNORE'){this.rowRole[er]={txt:'SKIP',K:null,bk:'SKIP',bold:false};if(!hit)state='SEEK';continue;}
      if(state==='SEEK'){
        if(hit){state='PENDING1';pend=er;}
        else this.rowRole[er]={txt:'SKIP',K:null,bk:'SKIP',bold:false};
      }else if(state==='PENDING1'){
        if(hit){
          this.rowRole[pend]={txt:'para K'+K,K:null,bk:'para',bold:false};
          this.rowRole[er]  ={txt:'SPRAWDŹ K'+K,K:null,bk:'SPRAWDŹ',bold:false};
          paras.push([pend,K]); state='SPRAWDZ';
        }else{
          this.rowRole[pend]={txt:'SKIP',K:null,bk:'SKIP',bold:false};
          this.rowRole[er]  ={txt:'SKIP',K:null,bk:'SKIP',bold:false}; state='SEEK';
        }
      }else if(state==='SPRAWDZ'){
        if(hit){
          this.rowRole[er]={txt:'✓ WIN',K:K,bk:'WIN',bold:true};
          this.winCycles.push([er,K]); this.cycleParas[er]=paras.slice();
          paras=[];K=1;state='IGNORE';
        }else{this.rowRole[er]={txt:'miss',K:null,bk:'miss',bold:false};K+=1;state='SEEK';}
      }
    }
    if(state==='PENDING1'&&pend!==null) this.rowRole[pend]={txt:'SKIP',K:null,bk:'SKIP',bold:false};
    this.baseState={state,K,pend,curParas:paras.slice()};
  }
  _models(){
    const n=this.winCycles.length;
    for(const m of MODELS){
      const name=m.name, ev={}; let tn=0;
      const add=(er,ti,p,t)=>{(ev[er]=ev[er]||[]).push([ti,p,t]);};
      for(let i=0;i<n;i++){
        const [erI,MI]=this.winCycles[i];
        if(!m.trig.has(MI)) continue;
        tn++; this.trigTotal[name]++;
        const open=(i+OFFSET>=n);
        add(erI,i,'trigger','▶ TRIGGER #'+tn+' M='+MI+(open?' (OPEN)':''));
        for(let s=1;s<START_STEP;s++) if(i+s<n) add(this.winCycles[i+s][0],i,'krok','· przygotowanie '+s+'/6 [T:'+tn+']');
        if(i+START_STEP<n) add(this.winCycles[i+START_STEP][0],i,'start','★ START · gra na nast. cyklu [T:'+tn+']');
        if(i+OFFSET<n){
          const [erG,MG]=this.winCycles[i+OFFSET];
          for(const [pe,Kp] of (this.cycleParas[erG]||[])) add(pe+1,i,'gra',name+' · krok gry '+Kp+' [T:'+tn+']');
          const res=MG<=K_LIMIT?'WIN':'LOSS';
          add(erG,i,res==='WIN'?'win':'loss',(res==='WIN'?'✓ WIN K=':'✗ LOSS K=')+MG+' [T:'+tn+']');
          this.games[name].push({triggerEr:erI,M:MG,result:res,income:profit(MG)});
        }else{
          this.openCount[name]++;
          // najnowszy event dla tego okna: dla done>=1 to wiersz przygotowania done/6,
          // dla done==0 to sam trigger
          const doneN = n - 1 - i;
          let eventEr = erI;
          if(doneN >= 1 && doneN <= 6){
            const idx = i + doneN;   // winCycles[idx] to wiersz ostatniego zdarzenia
            if(idx < n) eventEr = this.winCycles[idx][0];
          }
          // NOWE: jeśli cykl GRY to następny cykl po obecnym stanie bazy
          // (i+OFFSET === n), pary tego cyklu SĄ w baseState.curParas.
          // Dodaj im etykiety krok gry na SPRAWDŹ (paraEr+1).
          if(i + OFFSET === n && this.baseState.curParas){
            for(const [paraEr, Kp] of this.baseState.curParas){
              add(paraEr+1, i, 'gra', name+' · krok gry '+Kp+' [T:'+tn+']');
            }
            // Jeśli baza jest w PENDING1 albo SPRAWDZ, to jest jeszcze
            // nowa para „w budowie" - jej krok gry to K+1
            if(this.baseState.state==='SPRAWDZ' && this.baseState.pendingEr){
              // para jest już potwierdzona, jej para+SPRAWDŹ już w curParas? Sprawdź.
              // W kodzie: paras.push([pend,K]) dzieje się gdy PENDING1→SPRAWDZ
              // Więc jak jesteśmy w SPRAWDZ, ostatnia para już jest w curParas.
              // Nic więcej nie trzeba.
            }
          }
        }
      }
      for(const k of Object.keys(ev)){
        const list=ev[k].slice().sort((a,b)=>a[0]-b[0]);
        const tags=list.map(e=>e[1]); let prio=null;
        for(const p of EVENT_PRIORITY) if(tags.includes(p)){prio=p;break;}
        this.rowModel[+k][name]={text:list.map(e=>e[2]).join(' | '),prio};
      }
    }
  }
  stats(name){
    const g=this.games[name], w=g.filter(x=>x.result==='WIN').length;
    return {trig:this.trigTotal[name],games:g.length,wins:w,loss:g.length-w,
      open:this.openCount[name],wr:g.length?w/g.length*100:0,
      pnl:g.reduce((s,x)=>s+x.income,0)};
  }
}

/* =====================================================================

   ===================================================================== */

const APP_VER='1.1.2';        // ← numer wersji apki (rośnie z każdą aktualizacją)
const APP_DATE='2026-08-23';
const KEY='v13_troika_codes_v1';
const KEY_BAK='v13_troika_lastbackup';
const KEY_AUTO='v13_troika_autobak';
const AUTO_EVERY=10;    // auto-kopia co N kodów
const NAG_AFTER=25;     // przypomnienie po N kodach bez kopii
const PAGE=250;

let codes=[], model=null, cur='T1', filterOn=false, shown=PAGE, canStore=true;
let lastBackupN=0, autoBak=true, persistOK='nieznany';

const $=id=>document.getElementById(id);

function load(){
  try{
    const s=localStorage.getItem(KEY);
    if(s!==null) return s?s.split(','):[];
  }catch(e){ canStore=false; $('warn').style.display='block'; }
  return SEED?SEED.match(/.{3}/g):[];
}
function save(){
  if(!canStore) return;
  try{ localStorage.setItem(KEY,codes.join(',')); }
  catch(e){ canStore=false; $('warn').style.display='block'; }
}

function recompute(){ model=new V13Model(codes); }

/* ── TRWAŁY MAGAZYN — chroni przed automatycznym kasowaniem ── */
async function askPersist(){
  try{
    if(!navigator.storage||!navigator.storage.persist){persistOK='niedostępny';return;}
    if(await navigator.storage.persisted()){persistOK='włączony';return;}
    persistOK=(await navigator.storage.persist())?'włączony':'odmówiony';
  }catch(e){ persistOK='niedostępny'; }
}

/* ── KOPIE ZAPASOWE ── */
function readNum(k,d){ try{const v=localStorage.getItem(k);return v===null?d:Number(v);}catch(e){return d;} }
function writeVal(k,v){ try{localStorage.setItem(k,String(v));}catch(e){} }

function sinceBackup(){ return Math.max(0, codes.length - lastBackupN); }

function renderBakBar(){
  const bar=$('bak'), n=sinceBackup();
  if(!autoBak && n>=NAG_AFTER){
    $('bakTxt').textContent='Od ostatniej kopii: '+n+' kodów';
    bar.style.display='block';
  }else bar.style.display='none';
}

function doBackup(silent){
  exportJson(silent);
  lastBackupN=codes.length; writeVal(KEY_BAK,lastBackupN); renderBakBar();
}

function maybeAutoBackup(){
  if(autoBak && sinceBackup()>=AUTO_EVERY) doBackup(true);
  else renderBakBar();
}

/* ── PULPIT ── */
function renderPulpit(){
  const p=$('pulpit'); p.innerHTML='';
  const card=(cls,lbl,val,jumpEr)=>{
    const d=document.createElement('div'); d.className='card '+cls;
    d.innerHTML='<div class="lbl"></div><div class="val"></div>';
    d.children[0].textContent=lbl; d.children[1].textContent=val;
    if(jumpEr) d.onclick=()=>jumpTo(jumpEr);
    p.appendChild(d);
  };

  // stan bazy — najważniejsza informacja „co teraz"
  const bs=model.baseState||{state:'SEEK',K:1};
  const nice={SEEK:'szukam pary',PENDING1:'1. trafienie',SPRAWDZ:'SPRAWDŹ — 3-cie decyduje',IGNORE:'po WIN — ignoruję'};
  const baseEr = bs.pend || (model.winCycles.length?model.winCycles[model.winCycles.length-1][0]:model.N);
  card('base','Stan bazy · K='+bs.K, nice[bs.state]||bs.state, baseEr);

  const ow=model.openWindows[cur];
  if(!ow.length){ card('','Otwarte okna '+cur,'brak'); }
  ow.slice().reverse().forEach(w=>{
    if(w.done>=6)      card('now','#'+w.tn+' · '+cur,'GRA na nast. cyklu',w.eventEr);
    else if(w.done===5)card('hot','#'+w.tn+' · '+cur,'START za 1 cykl',w.eventEr);
    else               card('','#'+w.tn+' · '+cur,'przygotowanie '+w.done+'/6',w.eventEr);
  });

  const s=model.stats(cur);
  card('','Ostatnie gry '+cur, s.games+' · WR '+s.wr.toFixed(1)+'%');
}

/* ── TABELA ── */
function visibleRows(){
  const out=[];
  for(let er=model.N;er>=1;er--){
    if(filterOn){
      const mm=model.rowModel[er]&&model.rowModel[er][cur];
      if(!mm) continue;
    }
    out.push(er);
    if(out.length>=shown) break;
  }
  return out.reverse();
}

function renderTable(keepScroll){
  const tw=$('tw'), tb=$('tb');
  const atBottom = keepScroll ? false : true;
  tb.innerHTML='';
  if(!model.N){ $('empty').style.display='block'; renderPulpit(); return; }
  $('empty').style.display='none';

  const rows=visibleRows();
  const total = filterOn ? countFiltered() : model.N;
  const frag=document.createDocumentFragment();

  if(rows.length<total){
    const tr=document.createElement('tr'); const td=document.createElement('td');
    td.colSpan=5; td.style.padding='0';
    const b=document.createElement('button'); b.id='more';
    b.textContent='↑ Pokaż wcześniejsze ('+(total-rows.length)+' wierszy)';
    b.onclick=()=>{shown+=PAGE;renderTable(true);};
    td.appendChild(b); tr.appendChild(td); frag.appendChild(tr);
  }

  for(const er of rows){
    const r=model.rowRole[er]||{txt:'',K:null,bk:'SKIP',bold:false};
    const mm=(model.rowModel[er]||{})[cur];
    const tr=document.createElement('tr');
    if(isX1x(model.codes[er-1])) tr.className='hit';
    const bg=BASE_FILL[r.bk]||'#fff';
    const cell=(cls,txt,style)=>{
      const td=document.createElement('td'); td.className=cls; td.textContent=txt;
      if(style) Object.assign(td.style,style); return td;
    };
    tr.appendChild(cell('c-nr',er,{background:bg}));
    tr.appendChild(cell('c-kod mono',model.codes[er-1]||'',{background:bg}));
    tr.appendChild(cell('c-rola',r.txt,{background:bg,fontWeight:r.bold?'700':'400'}));
    tr.appendChild(cell('c-k',r.K??'',{background:bg}));
    if(mm){
      const st=MODEL_STYLE[mm.prio]||['#FFFFFF','#000000'];
      tr.appendChild(cell('c-mod',mm.text,{background:st[0],color:st[1]}));
    }else tr.appendChild(cell('c-mod','',null));
    frag.appendChild(tr);
  }
  tb.appendChild(frag);
  if(atBottom) requestAnimationFrame(()=>{tw.scrollTop=tw.scrollHeight;});
}

function jumpTo(er){
  if(!er||er<1||er>model.N) return;
  // wyłącz filtr jeśli utrudnia znalezienie wiersza
  if(filterOn){ filterOn=false; $('tFil').classList.remove('on'); }
  // dosyp starszych wierszy jeśli szukany jest poza aktualnym oknem
  const needed = model.N - er + 1;
  if(shown < needed){ shown = needed + 20; }
  renderTable(true);
  // przewiń do wiersza (wyszukaj po tekście Nr w komórce c-nr)
  requestAnimationFrame(()=>{
    const rows = document.querySelectorAll('#tb tr');
    for(const tr of rows){
      const nrCell = tr.querySelector('.c-nr');
      if(nrCell && Number(nrCell.textContent) === er){
        tr.classList.remove('flash'); void tr.offsetWidth; tr.classList.add('flash');
        tr.scrollIntoView({block:'center',behavior:'smooth'});
        break;
      }
    }
  });
  if(navigator.vibrate) navigator.vibrate(10);
}

function countFiltered(){
  let c=0; for(let er=1;er<=model.N;er++) if((model.rowModel[er]||{})[cur]) c++;
  return c;
}

function renderStatsChips(){
  ['T1','T2'].forEach((n,i)=>{
    const s=model.stats(n);
    $('s'+(i+1)).textContent=s.trig+' trig · '+s.games+' gier'+(s.open?' · '+s.open+' OPEN':'');
  });
  $('hint').innerHTML='Kodów: <b>'+model.N+'</b> · WIN-cykli: <b>'+model.winCycles.length+'</b>';
}

function renderAll(keep){ renderStatsChips(); renderPulpit(); renderTable(keep); }

/* ── KLAWIATURA ── */
const ALL=['000','001','010','011','100','101','110','111'];
function buildPad(){
  const pad=$('pad');
  ALL.forEach(c=>{
    const b=document.createElement('button');
    b.className='key'+(isX1x(c)?' x1x':'');
    b.textContent=c;
    b.onclick=()=>addCode(c);
    pad.appendChild(b);
  });
  const u=document.createElement('button');
  u.className='key und'; u.id='undo'; u.textContent='↶  Cofnij ostatni kod';
  u.onclick=undo; pad.appendChild(u);
}

function addCode(c){
  codes.push(c); save(); recompute();
  shown=Math.max(shown,PAGE);
  renderAll(false);
  const r=model.rowRole[model.N];
  toast(c+' → '+(r?r.txt:''));
  if(navigator.vibrate) navigator.vibrate(12);
  maybeAutoBackup();
}
function undo(){
  if(!codes.length) return toast('Brak kodów do cofnięcia');
  const last=codes[codes.length-1];
  if(!confirm('Cofnąć ostatni kod ('+last+')?\n\nZostanie usunięty z bazy '+codes.length+' kodów.')){ toast('Anulowano'); return; }
  const c=codes.pop(); save(); recompute(); renderAll(false);
  toast('Cofnięto '+c);
}

let tt;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),1600);
}

/* ── MENU ── */
function openMenu(){
  const b=$('statBox'); b.innerHTML='';
  ['T1','T2'].forEach(n=>{
    const s=model.stats(n);
    const d=document.createElement('div'); d.className='stat';
    d.innerHTML='<h3>'+n+' — trigger M='+(n==='T1'?1:2)+' · offset +7 · K8</h3>'+
      row('Triggery',s.trig)+row('Gry rozliczone',s.games)+row('Wygrane',s.wins)+
      row('Porażki',s.loss)+row('Okna otwarte (OPEN)',s.open)+
      row('Win rate',s.wr.toFixed(1)+'%')+row('Wynik',(s.pnl>=0?'+':'')+s.pnl+' zł');
    b.appendChild(d);
  });
  const d=document.createElement('div'); d.className='stat';
  d.innerHTML='<h3>Baza i dane</h3>'+row('Kodów',model.N)+row('WIN-cykli',model.winCycles.length)+
    row('Aktualne K',model.baseState.K)+row('Zapis lokalny',canStore?'działa':'NIE działa')+
    row('Trwały magazyn',persistOK)+row('Od ostatniej kopii',sinceBackup()+' kodów');
  b.appendChild(d);
  const v=document.createElement('div');
  v.style.cssText='text-align:center;color:var(--dim);font-size:11px;margin:14px 0 4px;line-height:1.6';
  v.innerHTML='TRÓJKA V1.3 · wersja <b style="color:var(--gold)">'+APP_VER+'</b> · '+APP_DATE+
              '<br>silnik zwalidowany zero-diff na 14911 kodach';
  b.appendChild(v);
  $('ovl').classList.add('on');
}
const row=(k,v)=>'<div><span style="color:var(--dim);font-weight:400">'+k+'</span><span>'+v+'</span></div>';

function exportJson(silent){
  const blob=new Blob([JSON.stringify({app:'v13_troika',saved:new Date().toISOString(),
    n:codes.length,codes},null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const d=new Date(), pad=x=>String(x).padStart(2,'0');
  a.download='v13_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+
             pad(d.getHours())+pad(d.getMinutes())+'_'+codes.length+'kod.json';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast(silent?'Auto-kopia: '+codes.length+' kodów':'Kopia zapisana ('+codes.length+' kodów)');
}
function importJson(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const d=JSON.parse(fr.result);
      const arr=Array.isArray(d)?d:d.codes;
      if(!Array.isArray(arr)) throw 0;
      const newCodes = arr.map(toCode).filter(Boolean);
      const cur = codes.length;
      const msg = cur > 0
        ? 'Zastąpić '+cur+' kodów w apce '+newCodes.length+' kodami z pliku?\n\nObecne kody zostaną nadpisane. Ta operacja jest nieodwracalna.'
        : 'Wczytać '+newCodes.length+' kodów z pliku?';
      if(!confirm(msg)){ toast('Anulowano import'); return; }
      codes = newCodes;
      lastBackupN=codes.length; writeVal(KEY_BAK,lastBackupN);
      save(); recompute(); renderAll(false); renderBakBar();
      toast('Wczytano '+codes.length+' kodów');
    }catch(e){ toast('Nie udało się wczytać pliku'); }
  };
  fr.readAsText(file);
}

/* ── START ── */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); cur=t.dataset.m; $('thMod').textContent=cur+' · off +7';
  shown=PAGE; renderAll(false);
});
$('tFil').onclick=()=>{filterOn=!filterOn;$('tFil').classList.toggle('on',filterOn);shown=PAGE;renderAll(false);};
$('btnMenu').onclick=openMenu;
$('miCls').onclick=()=>$('ovl').classList.remove('on');
$('ovl').onclick=e=>{if(e.target.id==='ovl')$('ovl').classList.remove('on');};
$('miExp').onclick=()=>doBackup(false);
$('bakBtn').onclick=()=>doBackup(false);
$('swAuto').onclick=()=>{
  autoBak=!autoBak; writeVal(KEY_AUTO,autoBak?1:0);
  $('swAuto').classList.toggle('on',autoBak);
  toast(autoBak?'Auto-kopia włączona':'Auto-kopia wyłączona'); renderBakBar();
};
$('miImp').onclick=()=>$('fileIn').click();
$('fileIn').onchange=e=>{if(e.target.files[0]){importJson(e.target.files[0]);$('ovl').classList.remove('on');}};
$('miTxt').onclick=()=>{navigator.clipboard.writeText(codes.join('\n')).then(()=>toast('Skopiowano '+codes.length+' kodów'),()=>toast('Schowek niedostępny'));};
$('miClr').onclick=()=>{
  if(confirm('Usunąć wszystkie '+codes.length+' kodów? Zrób najpierw kopię.')){
    codes=[]; save(); recompute(); renderAll(false); $('ovl').classList.remove('on'); toast('Wyczyszczono');
  }
};

buildPad();
codes=load().map(toCode).filter(Boolean);
autoBak=readNum(KEY_AUTO,1)===1;
lastBackupN=readNum(KEY_BAK,codes.length);
$('swAuto').classList.toggle('on',autoBak);
recompute();
renderAll(false);
renderBakBar();
askPersist();
</script>
</body>
</html>
