<script id="wsrc" type="text/js-worker">
"use strict";
// ===== SILNIK — FSM 1:1 z appek RAZEM (silnik 1T) i szukaj/engine.py =====
const ST = [8, 8, 16, 32, 64, 128, 256, 512], CUM = [8, 16, 32, 64, 128, 256, 512, 1024];
let AL = [], X = null, N = 0, Y = null;
const m1 = (p, c) => p.split('∪').some(q => q.length === 3 && [...q].every((x, i) => x === 'x' || x === c[i]));
function table(pred) {
  const parts = pred.split(' → '), t = new Uint8Array(3 * AL.length);
  parts.forEach((p, j) => AL.forEach((c, k) => { t[j * AL.length + k] = m1(p, c) ? 1 : 0; }));
  return { t, L: parts.length };
}
const _tc = new Map();
function tab(pred) { let v = _tc.get(pred); if (!v) { v = table(pred); _tc.set(pred, v); } return v; }
function hit(P, i) {
  if (i < P.L - 1) return false;
  const A = AL.length;
  for (let j = 0; j < P.L; j++) if (!P.t[j * A + X[i - P.L + 1 + j]]) return false;
  return true;
}
function limitFor(cyc, rules) { for (const [mc, mb] of rules) if (mc === null || cyc <= mc) return mb; return null; }
function qual(cyc, bu, R) { if (cyc < R.minCyc) return false; const l = limitFor(cyc, R.rules); return l !== null && bu <= l; }
// m = [typ, STEP, x, TRIGGER, off]; log(bet) wołane dla zakładów k5–k7 na wierszach >= from, gdy model spełniał kryteria
function sim(m, R, from, log) {
  const S = tab(m[1]), T = tab(m[3]), x = m[2], off = m[4];
  let st = 0, cnt = 0, bs = 0, i = 0, pnl = 0, nb = 0, nw = 0, nbu = 0, k5 = 0, k5w = 0, k5b = 0, srow = -1, wz = -1, ph = 0, le = -1, lt = 0, lk = 0;
  while (i < N) {
    if (st === 0) {
      if (hit(S, i)) { cnt++; if (cnt >= x) { st = 1; srow = i; } } else cnt = 0;
      i++;
    } else if (hit(T, i)) {
      const bp = i + off;
      if (bp >= N) { ph = 2; wz = bp; break; }
      const w = Y[X[bp]] === 1;
      if (log && bp >= from && bs >= 4 && bs <= 6 && qual(nw + nbu, nbu, R)) log(bp, bs, w);
      nb++; if (bs === 4) k5++;
      if (w) { pnl += ST[bs] * 3 - CUM[bs]; nw++; if (bs >= 4) k5w++; le = bp; lt = 1; lk = bs + 1; bs = 0; }
      else if (bs === 7) { pnl -= CUM[7]; nbu++; k5b++; le = bp; lt = 2; lk = 8; bs = 0; }
      else bs++;
      st = 0; cnt = 0; i = bp + 1;
    } else i++;
  }
  if (ph === 0 && st === 1) ph = 1;
  return { nb, nw, nbu, pnl, k5, k5w, k5b, bs, ph, srow, wz, cnt, le, lt, lk };
}
// etykiety wierszy dla jednego modelu (TABELA): K = rodzaj, A = licznik/krok, B = wiersz zakładu / zysk, Q = model spełniał kryteria
// K: 0 czekam na STEP · 1 czekam na TRIGGER · 2 step n/x · 3 STEP · 4 TRIGGER · 5 przed grą · 6 WIN · 7 przegrana · 8 BUST · 9 licznik → 0
function labels(m, R) {
  const S = tab(m[1]), T = tab(m[3]), x = m[2], off = m[4];
  const K = new Int8Array(N), A = new Int16Array(N), B = new Int32Array(N), Q = new Int8Array(N);
  let st = 0, cnt = 0, bs = 0, i = 0, nw = 0, nbu = 0;
  while (i < N) {
    if (st === 0) {
      if (hit(S, i)) { cnt++; if (cnt >= x) { st = 1; K[i] = 3; } else { K[i] = 2; } A[i] = cnt; }
      else { K[i] = cnt > 0 ? 9 : 0; cnt = 0; }
      i++;
    } else if (hit(T, i)) {
      const bp = i + off;
      K[i] = 4; A[i] = bs + 1; B[i] = bp; Q[i] = qual(nw + nbu, nbu, R) ? 1 : 0;
      for (let j = i + 1; j < Math.min(bp, N); j++) { K[j] = 5; A[j] = bs + 1; B[j] = bp; Q[j] = Q[i]; }
      if (bp >= N) break;
      const w = Y[X[bp]] === 1;
      A[bp] = bs + 1; Q[bp] = Q[i];
      if (w) { K[bp] = 6; B[bp] = ST[bs] * 3 - CUM[bs]; nw++; bs = 0; }
      else if (bs === 7) { K[bp] = 8; B[bp] = -CUM[7]; nbu++; bs = 0; }
      else { K[bp] = 7; bs++; }
      st = 0; cnt = 0; i = bp + 1;
    } else { K[i] = 1; i++; }
  }
  return { K, A, B, Q };
}
function setData(d) { AL = d.AL; X = Int8Array.from(d.X); N = X.length; Y = Uint8Array.from(d.Y); _tc.clear(); }
function evalAll(d) {
  const out = [], logs = [];
  d.pool.forEach((m, k) => {
    const r = sim(m, d.R, Math.max(d.seedN, m[5] || 0), (row, bs, w) => logs.push([row, k, bs, w ? 1 : 0]));
    out.push(r);
  });
  logs.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  return { out, logs };
}
function rnd(n) { return Math.floor(Math.random() * n); }
function search(d) {
  const { step, trig, R, have } = d, seen = new Set(have), found = [];
  const t0 = Date.now();
  for (let k = 0; k < d.n; k++) {
    const s = step[rnd(step.length)], tr = trig[rnd(trig.length)];
    const m = [s[0], s[1], s[0] === 'S' ? 1 + rnd(5) : 1, tr, 1 + rnd(7)];
    const key = m.join('|');
    if (seen.has(key)) continue;
    const r = sim(m, R);
    const cyc = r.nw + r.nbu;
    if (qual(cyc, r.nbu, R)) { seen.add(key); found.push(m); }
    if (k % 500 === 499) postMessage({ type: 'prog', k: k + 1, n: d.n, f: found.length, ms: Date.now() - t0 });
  }
  return found;
}
onmessage = e => {
  const d = e.data;
  if (d.type === 'data') { setData(d); return; }
  if (d.type === 'eval') { const r = evalAll(d); postMessage({ type: 'eval', id: d.id, ...r }); }
  if (d.type === 'label') { const r = labels(d.m, d.R); postMessage({ type: 'label', id: d.id, ...r }, [r.K.buffer, r.A.buffer, r.B.buffer, r.Q.buffer]); }
  if (d.type === 'search') { const f = search(d); postMessage({ type: 'search', found: f }); }
};
</script>
<script>
"use strict";
const CFG = __CFG__;            // {app, seedKey, razem, targets:[...], defRules, minCyc}
const MASTER_SEED = '__SEED__';
const POOLS = __POOLS__;        // {x1x:{seedN,pool:[[typ,STEP,x,TRIG,off]...]}, ...}
const APP_VER = '1.6.1';
const SEED_N = MASTER_SEED.length / 3;
const AL = CFG.alph, TPOS = { x1x: 1, xx1: 2, '1xx': 0 };
const LSK = { my: CFG.app + '_szukaj_v1_moje_', bands: CFG.app + '_szukaj_v1_bands', imp: CFG.app + '_szukaj_v1_lastimp', found: CFG.app + '_szukaj_v1_found_', rules: CFG.app + '_szukaj_v1_rules', tgt: CFG.app + '_szukaj_v1_tgt', ks: CFG.app + '_szukaj_v1_ks' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const $ = id => document.getElementById(id);

// ---- kody: seed + wspólne z RAZEM (ten sam klucz pamięci) ----
function readAdded() { const s = lsGet(CFG.seedKey, ''); return /^(\d{3})*$/.test(s) ? s : ''; }
let addedStr = readAdded();
let codes = [];
function rebuildCodes() { const s = MASTER_SEED + addedStr; codes = []; for (let i = 0; i < s.length; i += 3) codes.push(s.substr(i, 3)); }
rebuildCodes();

// ---- ustawienia ----
let tgt = lsGet(LSK.tgt, CFG.targets[0]); if (!CFG.targets.includes(tgt)) tgt = CFG.targets[0];
let R = (() => { try { const r = JSON.parse(lsGet(LSK.rules, '')); if (r && r.rules) {
  if (!r.rules.some(x => x[0] === null)) r.rules.push(CFG.defRules.find(x => x[0] === null) || [null, 11]);   // progi z v1.0: dopisz „ponad 400”
  return r; } } catch (e) {} return { rules: CFG.defRules, minCyc: CFG.minCyc }; })();
let KS = (() => { try { const v = JSON.parse(lsGet(LSK.ks, '')); if (Array.isArray(v)) return v; } catch (e) {} return [5, 6, 7]; })();
let view = 'gra', busy = false, searching = null, bandCap = {};
let BANDS = (() => { try { const v = JSON.parse(lsGet(LSK.bands, '')); if (Array.isArray(v)) return v; } catch (e) {} return R.rules.map((_, i) => i); })();
function foundKey() { return LSK.found + tgt; }
function getFound() { try { const v = JSON.parse(lsGet(foundKey(), '[]')); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function pool() {   // pula z chmury (znaleziona na bazie do Nr seedN) + znalezione w appce (m[5] = Nr, od którego liczy dziennik) + MOJE GRY spoza puli
  const base = POOLS[tgt].pool.map(m => [m[0], m[1], m[2], m[3], m[4], POOLS[tgt].seedN]).concat(getFound());
  const have = new Set(base.map(specKey));
  getMy().forEach(g => { if (!have.has(specKey(g.m))) { base.push([...g.m, g.start]); have.add(specKey(g.m)); } });
  return base;
}
// ---- MOJE GRY: modele, które gram — śledzone do WIN albo BUST (krok 8), niezależnie od kryteriów i filtrów ----
const specKey = m => m.slice(0, 5).join('|');
function getMy() { try { const v = JSON.parse(lsGet(LSK.my + tgt, '[]')); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function setMy(a) { lsSet(LSK.my + tgt, JSON.stringify(a)); }
function myIndex(g) { return P.findIndex(m => specKey(m) === specKey(g.m)); }
function isMine(k) { return k >= 0 && k < P.length && getMy().some(g => specKey(g.m) === specKey(P[k])); }
function startMy(k) {
  const r = lastEval.out[k], a = getMy().filter(g => specKey(g.m) !== specKey(P[k]));
  a.push({ m: P[k].slice(0, 5), id: mid(k, P[k]), start: codes.length, s0: r.bs + 1, t: Date.now() });
  setMy(a); toast(`Gram ${mid(k, P[k])} od kroku ${r.bs + 1} (${ST[r.bs]} zł) — w MOJE GRY do WIN / BUST`); render();
}
function stopMy(key) { setMy(getMy().filter(g => specKey(g.m) !== key)); render(); }
function myResult(g, r) {   // null = gra trwa; inaczej wynik od wejścia (stawki gracza od kroku s0)

function renderTab() {

    <div style="color:#c9cfdc;font-size:12.5px">${esc(ruleTxt(m))}</div>

        return `<button class="btn playing" data-stop="${esc(specKey(m))}">${res ? (res.win ? '✔ WIN' : '✖ BUST') + ` — zakończona (${res.pnl >= 0 ? '+' : ''}${res.pnl} zł). Usuń z MOJE GRY` : `■ Gram od w.${g.start + 1} (wejście k${g.s0}) — przestań śledzić`}</button>`; })()
      : `<button class="btn play" id="playBtn">▶ Gram ten model — śledź do WIN / kroku 8 (teraz krok ${r.bs + 1}, ${ST[r.bs]} zł)</button>`}
    <div class="selrow"><input id="selIn" placeholder="numer modelu, np. P3406" autocomplete="off"><button class="btn" id="selBtn">Pokaż</button></div>
    <div class="hint" style="margin-top:8px">Wybierz model z listy (grupy wg cykli, modele na krokach ${KS.map(k => ST[k - 1]).join('/')} zł):</div>${sel}
    <div class="leg">${[['L3', 'STEP'], ['L4', 'TRIGGER'], ['L5', 'przed grą'], ['L6', 'WIN'], ['L7', 'przegrana'], ['L8', 'BUST'], ['L9', 'licznik → 0']].map(([c, t]) => `<span class="lab ${c}">${t}</span>`).join('')}
    <span class="lab" style="background:var(--or);color:#fff;font-weight:700">GRA = Twój zakład (k${KS.join('/k')}, model w kryteriach)</span></div>
    <label class="hint" style="display:block;margin-top:6px"><input type="checkbox" id="evChk" ${tabEv ? 'checked' : ''}> tylko zdarzenia (bez „czekam…”)</label></div>`;
  if (!lab) return h + `<div class="ban idle">Nanoszę etykiety…</div>`;
  let next = '';

    if (r.ph === 2) next = r.wz === n ? `GRAJ k${r.bs + 1} ${ST[r.bs]} zł na ${tgt}` : `zakład k${r.bs + 1} ${ST[r.bs]} zł na w.${r.wz + 1}`;

  let shown = 0, i = n - 1;
  for (; i >= 0 && shown < tabN; i--) {

    const c = labCell(i), a = lab.A[i];
    let g = '', gc = 'dim';
    if (K >= 6 && K <= 8) { const my = KS.includes(a) && lab.Q[i]; g = (my ? 'GRA ' : 'k' + a + ' ') + ST[a - 1]; gc = my ? 'my' : 'dim'; }
    rows += `<tr class="${i >= SEED_N ? 'nw' : ''}"><td class="nr">${i + 1}</td><td class="kd ${isHit(codes[i]) ? 'h' : ''}">${codes[i]}</td><td class="g ${gc}">${g}</td><td><span class="lab ${c[0]}">${c[1]}</span></td></tr>`;
    shown++;
  }
  h += `<div class="sec"><table class="tbl"><tr><th>Nr</th><th>Kod</th><th>GRA</th><th>Stan / rola</th></tr>${rows}</table>`;
  if (i >= 0) h += `<button class="btn more" id="moreBtn">Pokaż starsze (+150)</button>`;
  h += `<div class="hint">Najnowsze u góry. Zielony kod = trafienie ${tgt}. • = kod dopisany po bazie.</div></div>`;

}
function renderDz() {
  if (!lastEval) return `<div class="ban idle">Liczę…</div>`;
  const L = lastEval.logs, n = codes.length;
  let h = `<div class="note"><b>Dziennik</b> = każdy zakład k5–k7 (64/128/256 zł) modelu, który w tej chwili spełniał kryteria, rozliczony na <b>nowych kodach</b> (od Nr ${SEED_N + 1}; modele znalezione w appce — od wiersza znalezienia). Zakład liczony osobno: WIN = +2 × stawka, pudło = −stawka (kurs 3,0). Opłacalność od trafności <b>33,3%</b>.</div>`;
  if (!L.length) return h + `<div class="ban idle">Brak zakładów na nowych kodach (dopisanych: ${n - SEED_N}).</div>`;
  const agg = { 5: [0, 0, 0], 6: [0, 0, 0], 7: [0, 0, 0] };
  L.forEach(([row, k, bs, w]) => { const a = agg[bs + 1], s = ST[bs]; a[0]++; a[1] += w; a[2] += w ? 2 * s : -s; });
  const tot = [0, 0, 0]; for (const k in agg) for (let j = 0; j < 3; j++) tot[j] += agg[k][j];
  const row = (lbl, a) => `<tr><td>${lbl}</td><td>${a[0]}</td><td>${a[1]}</td><td>${a[0] ? (100 * a[1] / a[0]).toFixed(1) + '%' : '—'}</td><td class="${a[2] >= 0 ? 'pos' : 'neg'}">${a[2] >= 0 ? '+' : ''}${a[2]}</td></tr>`;
  h += `<div class="sec"><table><tr><th>krok</th><th>zakł.</th><th>WIN</th><th>trafność</th><th>bilans zł</th></tr>` +
    [5, 6, 7].map(k => row(`k${k} · ${ST[k - 1]} zł`, agg[k])).join('') + row('<b>RAZEM</b>', tot) + `</table></div>`;
  const rows = {}; L.forEach(x => { (rows[x[0]] = rows[x[0]] || []).push(x); });
  h += `<div class="sec"><div class="sh"><b>Ostatnie wiersze z zakładami</b><span class="m">${Object.keys(rows).length} wierszy</span></div><table><tr><th>Nr · kod</th><th>zakł.</th><th>WIN</th><th>stawki zł</th><th>wynik zł</th></tr>`;
  Object.keys(rows).map(Number).sort((a, b) => b - a).slice(0, 80).forEach(r => {
    const a = rows[r], w = a.filter(x => x[3]).length, st = a.reduce((s, x) => s + ST[x[2]], 0), res = a.reduce((s, x) => s + (x[3] ? 2 * ST[x[2]] : -ST[x[2]]), 0);
    h += `<tr><td>${r + 1} · ${codes[r]}</td><td>${a.length}</td><td>${w}</td><td>${st}</td><td class="${res >= 0 ? 'pos' : 'neg'}">${res >= 0 ? '+' : ''}${res}</td></tr>`;
  });
  return h + `</table></div>`;
}
function stepSpace() {   // ta sama przestrzeń co szukaj/search.py
  const pats = []; for (const a of CFG.first) for (const b of '01x') for (const c of '01x') if (a + b + c !== 'xxx') pats.push(a + b + c);
  const step = [], trig = [...pats];
  const comb = (arr, r, st = 0, cur = []) => { if (cur.length === r) { step.push(['S', cur.join('∪')]); return; } for (let i = st; i < arr.length; i++) comb(arr, r, i + 1, [...cur, arr[i]]); };
  for (let r = 1; r <= CFG.maxUnion; r++) comb(AL, r);
  for (const p of pats) for (const q of pats) { step.push(['U', p + ' → ' + q]); trig.push(p + ' → ' + q); }
  return { step, trig };
}
function renderUst() {
  const f = getFound().length;

    `<tr><td>min. cykli</td><td><input id="minC" value="${R.minCyc}" inputmode="numeric"></td></tr></table>

  h += `<div class="sec"><div class="sh"><b>Szukaj nowych modeli</b><span class="m">na całym ciągu (${codes.length.toLocaleString('pl')} kodów)</span></div>
    <div class="kv"><span>pula z chmury (baza do Nr ${POOLS[tgt].seedN})</span><b>${POOLS[tgt].pool.length.toLocaleString('pl')}</b><span>znalezione w appce</span><b>${f.toLocaleString('pl')}</b></div>

  h += `<div class="sec"><div class="sh"><b>Import kodów</b><span class="m">teraz ${codes.length.toLocaleString('pl')} kodów</span></div>
    <div class="hint" style="margin:0 0 8px">Plik eksportu z ${CFG.razem} albo z jej tabel (.json z listą <b>codes</b>, pełny ciąg od Nr 1) albo plik tekstowy z kodami.
    Kody muszą zgadzać się z ciągiem w appce — dopisywane są tylko nowe. Trafiają też do ${CFG.razem} (wspólna pamięć).</div>
    <button class="btn pri" id="impBtn">Wybierz plik i importuj</button>

  h += `<div class="note">Szukaj ${APP_VER} · ${CFG.razem}: klucz kodów <b>${CFG.seedKey}</b>. Większe przeszukanie (miliony modeli) robi skrypt <b>szukaj/search.py</b> w repo.</div>`;

function render() {
  $('hdrN').textContent = `Nr ${codes.length.toLocaleString('pl')} · BET ${tgt}`;

    });

    };

    $('srch').onclick = () => {

    };

    $('impIn').onchange = e => {
      const f = e.target.files[0]; e.target.value = ''; if (!f) return;

}

async function checkVersion() {
